# Shared installer configuration
# Single source of truth for both the C installer and JavaScript publish scripts.
# C:  Makefile generates installer/src/_config.h from this file at build time.
# JS: tools/publish/paths.js reads this file at startup.
#
# Secrets (tokens) go in .env files, not here.

# GitHub repository owner
REPO_OWNER=onemen

# Project name (the firefox-scripts repo itself)
REPO_NAME=firefox-scripts

# Where to download zip packages from
ZIP_DOWNLOAD_REPO=firefox-scripts

# Installer version
VERSION=1.0.0

# GitHub release tag name
RELEASE_NAME=latest

# Artifact name suffix appended to published files: empty in prod
# (utils.zip, installer_win.exe), '-dev' in dev mode generated builds
# (utils-dev.zip, updater-ui-dev.zip, installer_win-dev.exe,
# helper_win-dev.exe).  In dev mode the generators override this plus
# RELEASE_NAME/HASHES_URL/ZIP_PAGES_URL/HELPER_BASE_URL for the
# dev-build-<id> namespace — the value here is the production default.
ASSET_SUFFIX=

# Full URL to the hash manifest (published to the gh-pages branch, which sends
# Access-Control-Allow-Origin: * so the CORS-constrained installer web tab can
# fetch it)
HASHES_URL=https://onemen.github.io/firefox-scripts/hashes.json

# Base URL for downloading the package zips.  Derived from REPO_OWNER /
# ZIP_DOWNLOAD_REPO / RELEASE_NAME, so changing the release tag means editing the
# single RELEASE_NAME line — nothing below references it again.  The config
# generator (tools/publish/syncGeneratedFiles.mjs, also invoked by the
# installer Makefile for C builds) expands ${VAR} references at build time.
ZIP_BASE_URL=https://github.com/${REPO_OWNER}/${ZIP_DOWNLOAD_REPO}/releases/download/${RELEASE_NAME}

# Where the INSTALLER web UI fetches the package zips.  The installer tab runs
# on http://localhost and does all network fetching in the browser, so this
# must be a host that answers with Access-Control-Allow-Origin: * — GitHub
# release assets do NOT (only a 302 to the assets CDN, which has no CORS
# header), GitHub Pages DOES.  The in-browser updater keeps ZIP_BASE_URL
# (release assets) because it is privileged and never needs CORS.
ZIP_PAGES_URL=https://onemen.github.io/firefox-scripts

# Repo + branch used by tools/publish/uploadToPages.mjs to publish the zips,
# helper binaries and hash manifest for ZIP_PAGES_URL (owner is REPO_OWNER;
# repo/branch must match the URL).
# NOTE: GitHub Pages must be enabled for that repo (Settings -> Pages ->
# "Deploy from a branch", branch ZIP_PAGES_BRANCH).
ZIP_PAGES_REPO=firefox-scripts
ZIP_PAGES_BRANCH=gh-pages

# Standalone elevated-copy helper — downloaded by the in-browser updater when
# the browser install dir is admin-protected.  Sources live in this repo under
# installer/src/helper/ (see installer/Makefile); the compiled binaries are
# published to the gh-pages branch (CORS-enabled, like the zips), so the
# updater fetches them from here:
#   https://onemen.github.io/firefox-scripts/helper_win.exe
HELPER_BASE_URL=https://onemen.github.io/firefox-scripts

# Default HTTP port.  Fixed (not 0) so that session-restored installer tabs
# from previous runs hit the SAME live server instead of a dead random port
# (which made Firefox show "Sorry. We're having trouble getting your pages
# back." on every restored stale tab).
DEFAULT_PORT=8777
