# Root-only workspace: publish tooling now lives in the root package.json.
packages: []

autoInstallPeers: true
saveExact: true
minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  - eslint
  - 'typescript'
  - 'typescript-eslint'
  - '@typescript-eslint/*'
  - '@typescript/native-preview*'
  - katex@0.19.0
  - shell-quote@1.12.0

overrides:
  brace-expansion: '>=1.1.20'
  js-yaml: '>=5.4.1'
  katex: '>=0.18.2'
  shell-quote: '>=1.11.0'
  smol-toml: '>=1.9.0'

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
