# Root-only workspace: publish tooling now lives in the root package.json.
packages: []

autoInstallPeers: true
saveExact: true
minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  - eslint
  - 'typescript'
  - 'typescript-eslint'
  - '@typescript-eslint/*'
  - '@typescript/native-preview*'
  - smol-toml@1.8.0

overrides:
  smol-toml: '>=1.7.1'
  # GHSA-qhr7-859c-m2p7: brace-expansion DoS via uncontrolled recursion on
  # nested brace groups. Three transitive copies ride devDependencies
  # (@microsoft/eslint-plugin-sdl, clang-format → minimatch); the patched
  # 1.1.20+ / 2.1.6+ / 5.0.11+ releases all satisfy this floor.
  brace-expansion: '>=1.1.20'
  # GHSA-r3ph-w7gj-g6xm: js-yaml merge keys let an empty merge source burn CPU
  # (maxTotalMergeKeys bounds key count, not merge depth). markdownlint-cli
  # pins js-yaml ~5.2.1, whose latest (5.4.0) is still affected; 5.4.1 is the
  # first fixed release, and the floor keeps every copy patched.
  js-yaml: '>=5.4.1'

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
