# Root-only workspace: publish tooling now lives in the root package.json.
packages: []

autoInstallPeers: true
saveExact: true
minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  - eslint
  - 'typescript'
  - 'typescript-eslint'
  - '@typescript-eslint/*'
  - '@typescript/native-preview*'
  - smol-toml@1.8.0

overrides:
  smol-toml: '>=1.7.1'
  # GHSA-qhr7-859c-m2p7: brace-expansion DoS via uncontrolled recursion on
  # nested brace groups. Three transitive copies ride devDependencies
  # (@microsoft/eslint-plugin-sdl, clang-format → minimatch); the patched
  # 1.1.20+ / 2.1.6+ / 5.0.11+ releases all satisfy this floor.
  brace-expansion: '>=1.1.20'

audit:
  # GHSA-vfj7-8cjw-p6xm: braces stack-exhaustion DoS through deeply nested
  # patterns. No patched release exists — 3.0.3 is the newest braces on npm and
  # the advisory lists `patched_versions: null` — so no override can clear it.
  # Not reachable: braces rides devDependencies only (markdownlint-cli2 →
  # globby/fast-glob → micromatch), the pattern strings come from tracked config
  # (config/.markdownlint-cli2.jsonc, ci.yml) rather than untrusted input, and
  # the runtime dependency surface is zero (ADR 0033), so nothing here reaches
  # a shipped artifact. Remove this entry when upstream ships a fix.
  ignore:
    - GHSA-vfj7-8cjw-p6xm

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
