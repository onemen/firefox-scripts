# Root-only workspace: publish tooling now lives in the root package.json.
packages: []

autoInstallPeers: true
saveExact: true
minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  - eslint
  - 'typescript'
  - '@typescript/typescript6'
  - 'typescript-eslint'
  - '@typescript-eslint/*'
  - '@typescript/native-preview*'
  - katex@0.19.0
  - shell-quote@1.12.0
  - zod@4.6.6
  - zod@3.25.76

overrides:
  # No parser-scoped TS pin here: pnpm v12.9.1 silently ignores parent
  # selectors (`pkg>dep`, verified inert in three forms), so both typescript
  # installs ride the 6.x alias directly (ADR 0046).
  brace-expansion: '>=1.1.20'
  js-yaml: '>=5.4.1'
  katex: '>=0.18.2'
  markdown-it: '>=14.3.3 <15.0.0'
  shell-quote: '>=1.11.0'
  smol-toml: '>=1.9.0'
  'zod@3.25.76': 'npm:zod@4.6.6'
  zod@4: '>=4.6.6'

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
  # undici-types@6.21.0 ships without provenance (nodejs/undici#4666), which
  # no-downgrade reads as a takeover; the locked bytes match the registry
  # (verified dist.integrity), and it arrives via @types/node@22, which the
  # docs-site toolchain pins (ADR 0046). Same class of pnpm false positive
  # as semver@6.3.1 above (pnpm/pnpm#10202).
  - undici-types@6.21.0
