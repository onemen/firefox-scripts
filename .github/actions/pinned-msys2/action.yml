# .github/actions/pinned-msys2/action.yml — MSYS2 UCRT64 whose mingw packages
# are the exact versions pinned in config/msys2-toolchain.json.
#
# Why not just `msys2/setup-msys2` with `update: false`: that skips the system
# upgrade but still installs whatever versions the runner's package DB offers,
# so gcc stayed 16.1.0-5 while binutils/crt/headers floated. The published
# Windows binaries are unsigned PEs whose AV verdict is per-hash (issue #157),
# and a floating toolchain silently changes those bytes — a local rebuild of
# the same commit differed from the CI artifact by ~4 KB of code
# (docs/DEVELOPING.md → "Why a clean local scan does not clear a CI build").
#
# Three things make the pin real, and each is separate work:
#
#   1. install   pacman -U the pinned files over whatever the runner had (a
#                deliberate downgrade when the mirror has moved on), then assert
#                every pinned version is the installed one.
#   2. PATH      put that toolchain first for every later step — including the
#                plain `shell: bash` steps that actually run the build. An
#                installed-but-shadowed toolchain is the silent failure: the
#                bytes come from somewhere else and nothing says so.
#   3. provenance  print which gcc/ld/windres/make the build shell resolves and
#                the version each reports, and fail if any of them is not the
#                pinned one. `pacman -Q` says what is installed; this says what
#                compiles, and it lands in the log next to the artifact.
#
# `pnpm toolchain:local` extracts the same files into a project-local prefix so
# a developer reproduces exactly those bytes on their own machine.

name: Pinned MSYS2 toolchain
description: >-
  MSYS2 UCRT64 with the exact package versions from config/msys2-toolchain.json (installed via
  pacman -U, first on PATH, then proven from the build shell)

runs:
  using: composite
  steps:
    - name: Set up MSYS2 (bootstrap)
      # update: false — see pages.yml: a mid-cycle pacman -Syu swapped the
      # toolchain and the rebuilt installer was falsely AV-flagged the next
      # day. The bootstrap only provides the dependency closure; the pinned
      # versions below replace it.
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
      with:
        msystem: UCRT64
        update: false
        install: >-
          mingw-w64-ucrt-x86_64-gcc make

    - name: Install the pinned toolchain versions
      shell: msys2 {0}
      # --install downloads (sha256-verified), pacman -U's and verifies in one
      # step: a mirror that no longer serves a pinned file, or a version that
      # would not stick, fails the job instead of quietly shipping different
      # bytes than the pin describes.
      run: node tools/ci/msys2Toolchain.mjs --install

    - name: Put the pinned toolchain first on PATH
      shell: msys2 {0}
      # Explicit, not inherited: `shell: bash` steps (the publish build runs in
      # one) resolve tools from the job PATH, where the runner image's own
      # mingw can outrank MSYS2's. Pinning here means the pin decides the bytes.
      # $MINGW_PREFIX is MSYS2's own pointer at the active MSYSTEM tree (/ucrt64).
      run: |
        cygpath -w "$MINGW_PREFIX/bin" >> "$GITHUB_PATH"
        cygpath -w /usr/bin >> "$GITHUB_PATH"
        echo "PINNED_TOOLCHAIN_PREFIX=$(cygpath -m "$MINGW_PREFIX/bin")" >> "$GITHUB_ENV"
        echo "pinned toolchain on PATH ahead of the runner image: $MINGW_PREFIX/bin"

    - name: Prove the build shell resolves the pinned toolchain
      shell: bash
      # Runs in the same shell flavor the build runs in, so this asserts what
      # actually compiles — versions, digests and the directory the tools come
      # from all land in the log beside the uploaded artifact.
      run: node tools/ci/msys2Toolchain.mjs --provenance --require-root "$PINNED_TOOLCHAIN_PREFIX"
