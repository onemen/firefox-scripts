# .github/actions/setup-browser/action.yml — Resolve a browser's official
# download URL, cache the downloaded installer, and install it via
# test/e2e/shared/downloads.mjs, which exports FIREFOX_BINARY through
# $GITHUB_ENV.
#
# Extracted from e2e.yml (2026-09): the resolve/cache/install step group was
# duplicated across the installer, updater, browser-matrix, updater-waterfox
# and fork-portable jobs; the per-job copies had drifted (different cache-key
# prefixes, single- vs two-hop redirect resolution) and every fix had to be
# applied N times. The composite is the single copy — a recipe change lands
# once, and check-gate-coverage keeps path-filter coverage unchanged because
# the filter lists `.github/actions/**` already.
#
# `browser` is the downloads.mjs key (firefox, firefox-dev, nightly,
# librewolf, floorp, zen, waterfox, firefox-esr-<major>). There is no
# `cache-key-prefix` input since ADR 0045: a key names the browser it caches
# (`<name>-<type>-<os>-<hash>-<layout>`), so a leg cannot put the same payload
# in a namespace of its own — which is how one waterfox installer came to be
# cached twice (firefox-dl + browser-dl).
#
# The key fields: `name` from downloads.mjs's registry (the browser), `type`
# the payload kind (`dl` installer, `portable` extracted tree), `os` the
# lowercase runner OS (`snap` for the snap leg), `layout` the spelling of that
# payload (`plain` for an installer, `dir` for the extracted tree), and `hash`
# the release identity: the download URL's sha256 prefix when that URL names
# its release (waterfox's CDN path, ESR's release-tagged URL), the published
# version or nightly build id when it does not, or `v<version>` for a sticky
# leg. A release change mints a new key either way.
#
# Two cache regimes (ADR 0034, cache-first amendment 2026-09-23):
#
# - Hard gates (firefox, firefox-dev, nightly, waterfox, esr): release-keyed.
#   The identity changes with the release, so the key invalidates on a vendor
#   bump and the leg tracks latest at run time. The three `?product=…-latest`
#   channels must resolve a version or build id for this: their URL is one
#   fixed string per OS, so a URL-derived key could never be superseded.
#
# - Fork legs (librewolf, floorp, zen): a STICKY per-browser key
#   (`<name>-<type>-<os>-v<version>-<layout>`), decoupled from the URL, and a
#   CACHE-FIRST install: when a cached installer exists, an unpinned leg
#   installs it with no download and no vendor resolution at all — the
#   URL-resolve step is skipped entirely, so a vendor API stall or a new
#   release can never delay a PR's fork legs. Only a PINNED dispatch (the
#   watchdog validating a release) downloads, and its green run saves the
#   installer under the version that actually ran, so there is exactly one
#   cache entry per validated release, never one per run. Unpinned legs
#   restore the newest entry through the `<name>-<type>-<os>-` prefix, which
#   is browser-scoped and so cannot cross-restore. A cold cache bootstraps
#   (record pin, else latest) and saves. Saves happen only after a successful
#   install, so a killed download can never poison the entry.

name: Set up browser (portable install)
description: >-
  Resolve the official download URL, cache installer + portable dir, install via downloads.mjs
  (exports FIREFOX_BINARY)

inputs:
  browser:
    description: downloads.mjs browser key (firefox, firefox-dev, nightly, a fork, …)
    required: true
  portable:
    description: >-
      'true' also sets PORTABLE_BROWSER_DIR and caches the extracted dir (used by the legs whose E2E
      asserts a portable layout)
    required: false
    default: 'false'
  pin-version:
    description: >-
      Version to pin the resolver to (the workflow's dispatch `version` escape, ADR 0021). Empty =
      the last E2E-validated release for fork browsers when the record has one, else `latest`.
    required: false
    default: ''

outputs:
  cache-key:
    description:
      The cache key the installer was saved under (release-identity hash or sticky version key)
    value: ${{ steps.fork-save.outputs.installer-key || steps.identity.outputs.installer-key }}
  portable-dir:
    description: PORTABLE_BROWSER_DIR when inputs.portable == 'true', else empty
    value: ${{ steps.portable-dir-unix.outputs.dir || steps.portable-dir-windows.outputs.dir }}

runs:
  using: composite
  steps:
    # ADR 0034: a fork leg installs the release the watchdog's dispatch last
    # validated. The record is written only by a green `browser-matrix` run on a
    # dispatch, so nothing here can advance its own pin. Restore is best-effort
    # (cache miss = no record) and the pin is only an OUTPUT — the install step
    # passes it to the resolver through the environment.
    - name: Restore the validated fork record
      if:
        ${{ inputs.pin-version == '' && contains(fromJSON('["librewolf","floorp","zen"]'),
        inputs.browser) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/fork-validated
        key: browser-fork-validated-${{ github.run_id }}
        restore-keys: browser-fork-validated-

    - name: Pin the last E2E-validated release
      id: fork-pin
      if:
        ${{ inputs.pin-version == '' && contains(fromJSON('["librewolf","floorp","zen"]'),
        inputs.browser) }}
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        RECORD: ${{ runner.temp }}/fork-validated/forks.json
        MAX_AGE_DAYS: '30'
      run: |
        node --input-type=module -e '
          import fs from "node:fs";
          const browser = process.env.BROWSER;
          const warn = m => console.log(`::warning::${m}`);
          if (!fs.existsSync(process.env.RECORD)) {
            warn(`no validated record for ${browser} (cold cache) — resolving latest`);
            process.exit(0);
          }
          const entry = JSON.parse(fs.readFileSync(process.env.RECORD, "utf8")).forks?.[browser];
          if (!entry?.version) {
            warn(`the validated record has no ${browser} entry — resolving latest`);
            process.exit(0);
          }
          const when = Date.parse(entry.validatedAt ?? "");
          if (!Number.isFinite(when)) {
            warn(`${browser} record has no usable validatedAt — resolving latest`);
            process.exit(0);
          }
          const ageDays = Math.floor((Date.now() - when) / 86400000);
          const max = Number(process.env.MAX_AGE_DAYS ?? 30);
          console.log(
            `pinned ${browser} ${entry.version} — validated ${ageDays} d ago` +
              ` (${entry.runUrl ?? "no run link"}), was newest at that time`
          );
          if (ageDays > max) {
            warn(`${browser} pin is ${ageDays} d old (> ${max}) — the watchdog dispatch may be failing`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${entry.version}\n`);
        '

    # ADR 0034 (cache-first amendment): fork legs (librewolf, floorp, zen) get
    # the sticky key namespace whatever the pin is — a pinned dispatch must
    # still SAVE into it so the next PR leg finds the new release. Only an
    # UNPINNED fork leg sets BROWSER_PREFER_CACHE (a pinned dispatch is the
    # watchdog validating a new release — it must download).
    - name: Select install-source mode
      id: mode
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        PORTABLE: ${{ inputs.portable }}
        DISPATCH_PIN: ${{ inputs.pin-version }}
      run: |
        # The name/os halves of every key this leg uses (ADR 0045). The name
        # comes from the browser's registry entry, so no leg chooses it; the os
        # token is the lowercase runner OS (`macOS` → `macos`).
        NAME=$(node test/e2e/shared/downloads.mjs "$BROWSER" --cache-name)
        OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
        echo "os=$OS" >> "$GITHUB_OUTPUT"
        # A fork leg keys on the installed version instead of the URL: its
        # restore must work with no vendor call (ADR 0034 cache-first).
        sticky=''
        case ",librewolf,floorp,zen," in
          *",$BROWSER,"*)
            sticky='true'
            if [ -z "$DISPATCH_PIN" ]; then
              echo "BROWSER_PREFER_CACHE=1" >> "$GITHUB_ENV"
            fi
            echo "fork leg — sticky keys $NAME-dl-$OS-v<version> / $NAME-portable-$OS-v<version> (prefer-cache: $([ -z "$DISPATCH_PIN" ] && echo yes || echo no — pinned dispatch downloads))"
            ;;
        esac
        echo "sticky=$sticky" >> "$GITHUB_OUTPUT"
        echo "BROWSER_DL_DIR=$RUNNER_TEMP/browser-dl" >> "$GITHUB_ENV"

    # The ~100 MB official browser download is the bulk of the install step, so
    # the hard gates resolve their CACHE IDENTITY here (ADR 0045): the download
    # URL when it names its release, the release identity when it does not —
    # Mozilla's `?product=firefox-latest`, `firefox-devedition-latest` and
    # `firefox-nightly-latest` are three fixed strings, so a URL-derived key was
    # the same key for every release ever published, an entry nothing could
    # supersede (measured 2026-10-09). Fork legs skip this step entirely: their
    # key is sticky, so a cache-first leg makes no network call here — a vendor
    # API stall can no longer delay a PR's fork legs, and a new fork release
    # cannot invalidate the key.
    - name: Resolve the cache identity
      id: identity
      if: steps.mode.outputs.sticky == ''
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        NAME: ${{ steps.mode.outputs.name }}
        OS: ${{ steps.mode.outputs.os }}
        # Empty for every non-fork browser (the pin step is skipped) and for a
        # fork leg whose record is cold.
        BROWSER_PIN_VERSION: ${{ steps.fork-pin.outputs.version || inputs.pin-version }}
      run: |
        # `--cache-identity` prints the URL, or — for a channel whose URL is a
        # `latest` alias — the release identity (version or nightly build id).
        # It warns and falls back to the URL rather than failing: a cache
        # concern must not red a required leg. The identity is hashed exactly
        # like a URL was, so the key shape and the pruner are unchanged.
        IDENTITY=$(node test/e2e/shared/downloads.mjs "$BROWSER" --cache-identity)
        HASH=$(node --input-type=module -e "import {createHash} from 'node:crypto'; console.log(createHash('sha256').update(process.argv[1]).digest('hex').slice(0, 16))" "$IDENTITY")
        # Name the release the key belongs to. Without this a log shows a hash
        # and nothing else, so a restored entry cannot be told from a cold one,
        # nor the key from a stale one — the question that cost a session when
        # the three `latest` channels keyed on their constant URLs.
        echo "cache identity: $IDENTITY"
        echo "cache hash: $HASH"
        # One release, two payloads: the installer and the tree extracted from
        # it share the identity hash and differ only in type/layout.
        echo "installer-key=$NAME-dl-$OS-$HASH-plain" >> "$GITHUB_OUTPUT"
        echo "dir-key=$NAME-portable-$OS-$HASH-dir" >> "$GITHUB_OUTPUT"

    # Restore/save split (not plain actions/cache) so the save happens only
    # after a successful install: a killed job's partial download must never
    # poison the entry every later leg restores. Hard gates: the exact
    # identity-hash key. Fork legs: the exact `<name>-<type>-<os>-v` key never exists (saves
    # carry a version), so restore always falls through to the newest entry
    # under the browser-scoped `<name>-<type>-<os>-` prefix.
    - name: Restore browser installer cache (URL-keyed)
      if: steps.mode.outputs.sticky == ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.BROWSER_DL_DIR }}
        key: ${{ steps.identity.outputs.installer-key }}

    - name: Restore browser installer cache (fork sticky)
      if: steps.mode.outputs.sticky != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.BROWSER_DL_DIR }}
        key: ${{ steps.mode.outputs.name }}-dl-${{ steps.mode.outputs.os }}-v
        restore-keys: ${{ steps.mode.outputs.name }}-dl-${{ steps.mode.outputs.os }}-

    - name: Set portable browser directory (Linux/macOS)
      id: portable-dir-unix
      if: inputs.portable == 'true' && runner.os != 'Windows'
      shell: bash
      env:
        TEMPDIR: ${{ runner.temp }}
      run: |
        echo "PORTABLE_BROWSER_DIR=$TEMPDIR/firefox-portable" >> "$GITHUB_ENV"
        mkdir -p "$TEMPDIR/firefox-portable"
        echo "dir=$TEMPDIR/firefox-portable" >> "$GITHUB_OUTPUT"

    - name: Set portable browser directory (Windows)
      id: portable-dir-windows
      if: inputs.portable == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $dir = Join-Path $env:RUNNER_TEMP 'firefox-portable'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        "PORTABLE_BROWSER_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    # The extracted dir is its own `type` (`portable`), so the installer and dir
    # entries can never restore into each other's paths via prefix matching (the
    # fork restore keys are prefixes by design).
    - name: Restore extracted portable browser cache (URL-keyed)
      if: inputs.portable == 'true' && steps.mode.outputs.sticky == ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PORTABLE_BROWSER_DIR }}
        key: ${{ steps.identity.outputs.dir-key }}

    - name: Restore extracted portable browser cache (fork sticky)
      if: inputs.portable == 'true' && steps.mode.outputs.sticky != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PORTABLE_BROWSER_DIR }}
        key: ${{ steps.mode.outputs.name }}-portable-${{ steps.mode.outputs.os }}-v
        restore-keys: ${{ steps.mode.outputs.name }}-portable-${{ steps.mode.outputs.os }}-

    # The browser itself always comes from downloads.mjs's official recipe
    # (apt's Snap wrapper breaks BiDi); it downloads via the official channel
    # redirect and exports FIREFOX_BINARY through $GITHUB_ENV. Fork legs
    # without a dispatch pin install the cached installer first (ADR 0034,
    # cache-first amendment) — see BROWSER_PREFER_CACHE in downloads.mjs.
    - name: Install ${{ inputs.browser }}
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        # Empty for a cold record so a job-level dispatch pin set through
        # `env:` is never clobbered by an empty step value.
        BROWSER_PIN_VERSION: ${{ steps.fork-pin.outputs.version || inputs.pin-version }}
      run: node test/e2e/shared/downloads.mjs "$BROWSER"

    # The sticky save key is the version that ACTUALLY ran — ground truth via
    # --installed-version, exactly what the validated-versions record stores.
    # Same version → same key → actions/cache/save no-ops (entry exists), so
    # the repo cache quota carries one entry per browser × os × layout ×
    # release, not one per CI run.
    - name: Derive the fork save key from the installed version
      id: fork-save
      if: steps.mode.outputs.sticky != ''
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        NAME: ${{ steps.mode.outputs.name }}
        OS: ${{ steps.mode.outputs.os }}
      run: |
        VER=$(node test/e2e/shared/downloads.mjs "$BROWSER" --installed-version)
        echo "installed version: $VER"
        echo "installer-key=$NAME-dl-$OS-v$VER-plain" >> "$GITHUB_OUTPUT"
        echo "dir-key=$NAME-portable-$OS-v$VER-dir" >> "$GITHUB_OUTPUT"

    # Save on the default branch only. Caches are ref-scoped: a `pull_request`
    # run writes into `refs/pull/<n>/merge`, which nothing but a re-run of that
    # PR can restore — not main, not a sibling PR (ADR 0044). Measured
    # 2026-10-09: these two steps were 34 entries / 4.27 GB of the repo's 58
    # entries / 6.57 GB, every byte unreachable from every other ref and
    # multiplied again by each open PR. PR legs still RESTORE main's entries
    # (the ref search falls through to the default branch), so the only new
    # cost is a cold leg when a PR runs a release main has never cached.
    - name: Save browser installer cache
      if: success() && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.BROWSER_DL_DIR }}
        key: ${{ steps.fork-save.outputs.installer-key || steps.identity.outputs.installer-key }}

    - name: Save extracted portable browser cache
      if: inputs.portable == 'true' && success() && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PORTABLE_BROWSER_DIR }}
        key: ${{ steps.fork-save.outputs.dir-key || steps.identity.outputs.dir-key }}
