# .github/actions/build-installer/action.yml — Build the native installer for
# the current runner OS in dev mode and export INSTALLER_BIN (the path form
# Node's fs can use — on Windows $PWD is MSYS-style, so github.workspace is
# used there).
#
# Extracted from e2e.yml (2026-09): the case-runner.os build block plus the
# #132 universal-mac lipo assertion were duplicated verbatim in the
# portable-firefox and snap-firefox jobs. One copy now; a build-recipe change
# cannot desynchronize the legs.
#
# Dev-mode artifacts keep their plain names (#282 suffix drop): the ⚠
# Test-build banner distinguishes dev builds, and the Makefile ASSET_SUFFIX is
# empty in every mode.
#
# LOCAL=1 (2026-09-21): a plain MODE=dev build bakes jsDelivr URLs for the
# per-run dev-build-<id> branch — which only exists after a real
# `pnpm publish:dev`, never on a PR. The E2E tab's package-zip fetches would all fail
# against that nonexistent branch (surfaced by UI-12 after #277: the portable
# and snap legs had been silently skipping ingest on every previous run).
# LOCAL=1 bakes localhost URLs + enables own-dir serving, the same binary
# shape the installer job gets from snapshot:dev, and the snapshot's four
# published artifacts are copied next to the exe below so serve_local_file
# finds them — hermetic, no network, same code paths under test.

name: Build native installer (dev, local-serving)
description: >-
  make dist_<os> MODE=dev LOCAL=1, assert the macOS universal slices, stage the snapshot artifacts
  next to the exe, export INSTALLER_BIN

outputs:
  installer-bin:
    description: Absolute path of the freshly built installer binary
    value: ${{ steps.bin.outputs.path }}

runs:
  using: composite
  steps:
    - name: Build native installer
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Linux) make -C installer dist_linux MODE=dev LOCAL=1 ;;
          macOS) make -C installer dist_mac MODE=dev LOCAL=1 ;;
          Windows) make -C installer dist_win MODE=dev LOCAL=1 ;;
        esac
        # Universal-binary check (#132): dist_mac now builds x86_64 + arm64 in
        # one fat installer_mac — assert both slices are really present and
        # executable, not just that the file exists.
        if [ "${{ runner.os }}" = macOS ]; then
          LIPO_ARCHS=$(lipo -archs dist/installer/installer_mac)
          echo "installer_mac architectures: $LIPO_ARCHS"
          for arch in x86_64 arm64; do
            case " $LIPO_ARCHS " in
              *" $arch "*) ;;
              *) echo "::error::installer_mac is missing the $arch slice (universal build broken)"; exit 1 ;;
            esac
          done
          lipo -thin x86_64 -output /tmp/installer_mac_x64 dist/installer/installer_mac
          lipo -thin arm64 -output /tmp/installer_mac_arm dist/installer/installer_mac
          # Execute only the host-arch slice (on an x86_64 runner the arm64
          # slice cannot run); assert the other slice structurally with `lipo
          # -info`, which does not depend on the host arch.
          HOST_ARCH=$(uname -m)
          if [ "$HOST_ARCH" = arm64 ]; then
            echo "arm64 slice:  $(/tmp/installer_mac_arm --version)"
            echo "x86_64 slice: $(lipo -info /tmp/installer_mac_x64)"
          else
            echo "x86_64 slice: $(/tmp/installer_mac_x64 --version)"
            echo "arm64 slice:  $(lipo -info /tmp/installer_mac_arm)"
          fi
        fi
        chmod +x dist/installer/installer_* 2>/dev/null || true

    # Stage the snapshot's published artifacts next to the freshly built exe:
    # CFG_LOCAL serving resolves every /GET against the exe's own directory,
    # so utils/fx-folder/updater-ui zips + hashes.json must sit beside it for
    # the tab's ingest (UI-12) to complete. The dev-snapshot artifact unpacks
    # to dist/dev-<branch>-<sha>/; copy from wherever it landed.
    - name: Stage snapshot artifacts beside the exe
      shell: bash
      run: |
        if compgen -G "dist/dev-*/hashes.json" > /dev/null; then
          for f in dist/dev-*/*.zip dist/dev-*/hashes.json; do
            [ -f "$f" ] && cp "$f" dist/installer/ && echo "staged: dist/installer/$(basename "$f")"
          done
        else
          echo "::warning::no dev snapshot found under dist/dev-* — the E2E ingest leg will fail"
        fi

    - name: Export INSTALLER_BIN
      id: bin
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Linux) BIN="$PWD/installer/../dist/installer/installer_linux" ;;
          macOS) BIN="$PWD/installer/../dist/installer/installer_mac" ;;
          # github.workspace expands to a native Windows path (D:\a\...);
          # $PWD would be MSYS-style (/d/a/...) which Node's fs cannot use.
          Windows) BIN="${{ github.workspace }}\\dist\\installer\\installer_win.exe" ;;
        esac
        echo "INSTALLER_BIN=$BIN" >> "$GITHUB_ENV"
        echo "path=$BIN" >> "$GITHUB_OUTPUT"
