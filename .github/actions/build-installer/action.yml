# .github/actions/build-installer/action.yml — Build the native installer for
# the current runner OS in dev mode and export INSTALLER_BIN (the path form
# Node's fs can use — on Windows $PWD is MSYS-style, so github.workspace is
# used there).
#
# Extracted from e2e.yml (2026-09): the case-runner.os build block plus the
# #132 universal-mac lipo assertion were duplicated verbatim in the
# portable-firefox and snap-firefox jobs. One copy now; a build-recipe change
# cannot desynchronize the legs.
#
# The dev-mode artifact carries the -dev suffix (ASSET_SUFFIX in the Makefile,
# mirrored by tools/publish/paths.js).

name: Build native installer (dev)
description: >-
  make dist_<os> MODE=dev, assert the macOS universal slices, export INSTALLER_BIN

outputs:
  installer-bin:
    description: Absolute path of the freshly built installer binary
    value: ${{ steps.bin.outputs.path }}

runs:
  using: composite
  steps:
    - name: Build native installer
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Linux) make -C installer dist_linux MODE=dev ;;
          macOS) make -C installer dist_mac MODE=dev ;;
          Windows) make -C installer dist_win MODE=dev ;;
        esac
        # Universal-binary check (#132): dist_mac now builds x86_64 + arm64 in
        # one fat installer_mac — assert both slices are really present and
        # executable, not just that the file exists.
        if [ "${{ runner.os }}" = macOS ]; then
          LIPO_ARCHS=$(lipo -archs dist/installer/installer_mac-dev)
          echo "installer_mac architectures: $LIPO_ARCHS"
          for arch in x86_64 arm64; do
            case " $LIPO_ARCHS " in
              *" $arch "*) ;;
              *) echo "::error::installer_mac-dev is missing the $arch slice (universal build broken)"; exit 1 ;;
            esac
          done
          lipo -thin x86_64 -output /tmp/installer_mac_x64 dist/installer/installer_mac-dev
          lipo -thin arm64 -output /tmp/installer_mac_arm dist/installer/installer_mac-dev
          # Execute only the host-arch slice (on an x86_64 runner the arm64
          # slice cannot run); assert the other slice structurally with `lipo
          # -info`, which does not depend on the host arch.
          HOST_ARCH=$(uname -m)
          if [ "$HOST_ARCH" = arm64 ]; then
            echo "arm64 slice:  $(/tmp/installer_mac_arm --version)"
            echo "x86_64 slice: $(lipo -info /tmp/installer_mac_x64)"
          else
            echo "x86_64 slice: $(/tmp/installer_mac_x64 --version)"
            echo "arm64 slice:  $(lipo -info /tmp/installer_mac_arm)"
          fi
        fi
        chmod +x dist/installer/installer_* 2>/dev/null || true

    - name: Export INSTALLER_BIN
      id: bin
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Linux) BIN="$PWD/installer/../dist/installer/installer_linux-dev" ;;
          macOS) BIN="$PWD/installer/../dist/installer/installer_mac-dev" ;;
          # github.workspace expands to a native Windows path (D:\a\...);
          # $PWD would be MSYS-style (/d/a/...) which Node's fs cannot use.
          Windows) BIN="${{ github.workspace }}\\dist\\installer\\installer_win-dev.exe" ;;
        esac
        echo "INSTALLER_BIN=$BIN" >> "$GITHUB_ENV"
        echo "path=$BIN" >> "$GITHUB_OUTPUT"
