# .github/actions/bound-apt/action.yml — Install apt packages with bounded
# fetch and retries, so a stalled archive mirror fails fast instead of eating
# the whole job timeout (issue #461).
#
# Why: every `apt-get` call here was unbounded — no `timeout`, no
# `Acquire::Retries`, no `Acquire::*::Timeout`. On 2026-10-07 four jobs hung
# in `apt-get update`/`install xvfb` until `timeout-minutes` cancelled them,
# burning the entire job budget in setup before a single test ran. This action
# bounds the update to 120 s, retries up to 3 attempts with backoff, sets
# acquire + dpkg-lock timeouts, and skips the install when the probe command
# is already present.
#
# Inputs: `packages` (space-separated apt names, required), `already-if`
# (optional command name — `command -v` short-circuits the install).

name: Bounded apt install
description: >-
  Install apt packages with a bounded fetch (timeout 120 s), retries with backoff, and
  acquire/dpkg-lock timeouts; skips when the probe command exists
inputs:
  packages:
    description: space-separated apt package names to install
    required: true
  already-if:
    description: command name whose presence skips the install entirely
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install apt packages (bounded fetch + retries)
      shell: bash
      run: |
        pkgs="${{ inputs.packages }}"
        probe="${{ inputs.already-if }}"
        if [ -n "$probe" ] && command -v "$probe" >/dev/null 2>&1; then
          echo "$probe is already installed — skipping apt."
          exit 0
        fi
        opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
        attempt=1
        delay=10
        # shellcheck disable=SC2086
        # Bounds: update ≤120 s (the issue's number), install ≤150 s. Worst case
        # is 3 × (120 + 150) + 30 s of backoff = 840 s, inside even the tightest
        # 15-minute budget that installs apt packages (asserted by
        # test/unit/tools/boundApt.test.mjs).
        while [ "$attempt" -le 3 ]; do
          # Capture apt's own words. `-qq` hides progress, and when the outer
          # bound kills apt it has printed nothing at all — so on 2026-10-09 the
          # aarch64 toolchain install burned all three attempts and the step
          # said only "apt install failed after 3 attempts". That silent failure
          # is what skipped the whole E2E matrix behind the snapshot job, with no
          # reason to act on. The bound does not change; the reason does.
          apt_log="$(mktemp)"
          rc=0
          timeout 120 sudo apt-get update -qq "${opts[@]}" >"$apt_log" 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            timeout 150 sudo apt-get install -y -qq "${opts[@]}" $pkgs >>"$apt_log" 2>&1 || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            rm -f "$apt_log"
            echo "apt install succeeded on attempt $attempt: $pkgs"
            exit 0
          fi
          # 124 is `timeout`'s own status: the bound fired and apt was killed
          # mid-fetch, which needs a mirror/bound answer. Any other status is
          # apt's, which needs the apt answer.
          if [ "$rc" -eq 124 ]; then
            echo "apt attempt $attempt hit its bound (timeout killed it) — tail of its output:"
          else
            echo "apt attempt $attempt exited $rc — tail of its output:"
          fi
          tail -n 15 "$apt_log" | sed 's/^/    /' || true
          rm -f "$apt_log"
          attempt=$((attempt + 1))
          # Sleep only when another attempt remains: a settle pause after the
          # LAST failure buys nothing and inflates the worst case (the test
          # asserts the real bound).
          if [ "$attempt" -le 3 ]; then
            echo "apt attempt $((attempt - 1)) failed — retrying in ${delay}s"
            sleep "$delay"
          fi
          delay=$((delay * 2))
        done
        echo "::error::apt install failed after 3 attempts: $pkgs"
        exit 1
