name: CI

# Actions are pinned to full commit SHAs (supply-chain hardening — mutable
# major-version tags can be silently retagged).  The tag each SHA tracks is in
# a trailing comment; `.github/dependabot.yml` refreshes the SHAs.
on:
  pull_request:
  push:
    branches: [main]
  # Required checks must also run on the merge-queue's temporary branch when
  # a PR lands via the queue (Settings → merge queue) — see docs/DEVELOPING.md.
  merge_group:

# One run per ref: a new push to a PR branch supersedes (cancels) the branch's
# previous CI run. `main` and merge-queue refs are distinct groups, and
# cancel-in-progress is gated to pull_request so a main push is never cancelled
# by anything — main's push run is what re-exercises the advisory E2E legs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Changed-paths filter ──────────────────────────────────────────────────
  # Docs-only / tooling-only PRs skip the publish gate (`build`): nothing that
  # gets packaged or built changed. `checks` and `ci-gate` always run, so the
  # required checks never go missing. See docs/DEVELOPING.md → CI.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    # Job-level timeouts (belt-and-suspenders, all jobs here): GitHub's
    # default is 360 min — a wedged job would hang until then. The values
    # are multiples of the slowest observed green run per group (see
    # docs/ci-inventory.md → Job timeouts).
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.filter.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            publish:
              - 'core/**'
              - 'config/installer.conf'
              - 'installer/**'
              - 'tools/publish/**'
              # The publish AV/VT scan tools run inside upload.mjs (the gate's
              # `upload:local` rehearsal), so edits to them must re-trigger it.
              - 'tools/scan-av.mjs'
              - 'tools/scan-vt.mjs'
              # The pinned Windows toolchain: the gate builds with it, so a pin
              # edit must re-run the gate on the new pin.
              - 'config/msys2-toolchain.json'
              - 'tools/ci/msys2Toolchain.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  # Fast static gate: eslint (incl. security plugin) + prettier + clang-format
  # + the gcc -fanalyzer C analysis.  Runs on every PR and on main pushes.
  checks:
    name: lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: $/.github/actions/setup-repo
      - run: pnpm lint
      - run: pnpm format
      # Coverage rides the same run (2026-09-15 audit): the report goes to the
      # log only — no threshold gate, so this can never fail a PR.
      - run: node --test --experimental-test-coverage "test/unit/**/*.test.mjs"
      # Supply-chain gate (2026-09-15 audit): fails the PR on any known high
      # or critical vulnerability in the dependency tree. Dev-only tree, so
      # only new advisories should ever trip it; Dependabot's weekly pnpm
      # entry keeps the tree moving between advisories.
      - run: pnpm audit --audit-level=high
      - run: pnpm check:decisions
      - run: pnpm check:gates

  # Publish-path gate: `upload:local --mode=dev` rebuilds the zips and the
  # native binaries for the runner's OS.  This is what catches regressions in
  # the generated files, hashes and Makefile before they reach a release.
  build:
    name: publish gate — ${{ matrix.os }}
    needs: changes
    # No job-level if: a skipped required check blocks strict branch
    # protection, so the job always runs and reports success. The real steps
    # are gated on publish-relevant changes below; a filtered-out run is a
    # fast no-op (the ci-gate still treats it as 'skipped — no publish-
    # relevant changes'). See ADR 0017: required checks never go missing.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Publish gate with the full native build: slowest observed 129 s
    # (windows-latest, MSYS2 gcc); a cold MSYS2 toolchain install adds ~3 min.
    timeout-minutes: 20
    steps:
      - name: Skip publish gate — no publish-relevant changes
        if: needs.changes.outputs.publish != 'true'
        run: echo "::notice::no publish-relevant changes — publish gate skipped"
      - uses: $/.github/actions/setup-repo
        if: needs.changes.outputs.publish == 'true'

      # The publish gate rehearses the exact Windows build, so it uses the
      # pinned toolchain (config/msys2-toolchain.json) rather than whatever
      # MSYS2 happens to install — see the AV section of docs/DEVELOPING.md.
      - name: Pinned MSYS2 toolchain (make + gcc)
        if: runner.os == 'Windows' && needs.changes.outputs.publish == 'true'
        uses: ./.github/actions/pinned-msys2

      # The runner image's third-party apt sources can churn out-of-band and
      # break `apt-get update` for everyone (2026-09-09 Google Chrome index).
      - name: Harden apt sources
        if: runner.os == 'Linux' && needs.changes.outputs.publish == 'true'
        uses: ./.github/actions/harden-apt

      # ARM64 cross-compiler for the aarch64 Linux binaries (the 'linux'
      # platform implies the aarch64 twin in upload.mjs).
      - name: Install aarch64 cross toolchain (Linux)
        if: runner.os == 'Linux' && needs.changes.outputs.publish == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1

      - name: Build all packages and binaries
        if: needs.changes.outputs.publish == 'true'
        shell: bash
        run: pnpm upload:local --mode=dev

      # Security regression gate: every state-changing /api route must reject
      # a missing/wrong session token, and no response may carry the wildcard
      # Access-Control-Allow-Origin header.  Windows only: it drives the win
      # binary; the same gate logic is covered on other OSes by review.
      - name: Security smoke test — installer API
        if: runner.os == 'Windows' && needs.changes.outputs.publish == 'true'
        shell: bash
        run: node test/e2e/installer/smoke-security.mjs

      # JS vs C hash parity against the dev snapshot built above (test_hash
      # accepts both prod- and dev- snapshots, so no second build is needed).
      # test:hash also runs test_self_update.mjs — the date-based self-update
      # contract (ADR 0019 amendment) needs the built binary's
      # --test-self-update mode.
      - name: Hash parity — JS vs C installer
        if: runner.os == 'Windows' && needs.changes.outputs.publish == 'true'
        shell: bash
        run: pnpm test:hash

      - name: Upload dist artifacts
        if: needs.changes.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  # ── CI gate ──────────────────────────────────────────────────────────────
  # Single branch-protection check — only registers as success when all
  # upstream jobs pass. The verify logic (incl. the always-report guard on
  # `build`, which has NO job-level `if:` by design) lives in the shared
  # .github/actions/verify-gate engine, kept consistent with e2e-gate.
  # `pnpm check:gates` enforces this needs list.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [changes, checks, build]
    steps:
      # Local action — a fresh runner needs the repo checked out first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/verify-gate
        with:
          changes-result: ${{ needs.changes.result }}
          branch: ${{ needs.changes.outputs.publish }}
          branch-label: publish-relevant changes
          # Literal block: prettier leaves `|` content alone, so each pair
          # stays on its own line and no ${{ }} expression is ever split.
          # verify.sh splits the value on whitespace, newlines included.
          results: |-
            checks:${{ needs.checks.result }}
            build:${{ needs.build.result }}
          always-verify: checks
          required: build
          always-report: build
