# E2E test matrix
#
# Installer E2E: builds the installer, starts it headless, exercises the
# HTTP API (token gate, gated routes, status). Hard gate on all 3 OSes.
#
# Helper E2E: builds + tests the elevated-copy helper binary under sudo
# (Linux only).  The OS elevation prompt cannot be automated, but the copy
# core — including the defaults/pref directory walk-up — is tested here.
#
# Updater E2E: uses the shared dev snapshot (built once by the `snapshot`
# job), installs Firefox, creates a test profile with scripts, launches
# Firefox via puppeteer-core + WebDriver BiDi, and asserts the updater tab
# renders the correct state. Advisory gate across the supported browser × OS
# matrix.
#
# See: docs/e2e-matrix-plan.md, https://github.com/onemen/firefox-scripts/issues/3

name: E2E

permissions:
  contents: read
  # No workflow-level issues: write — every E2E job runs build/test code from
  # the PR, so issue-write access must be scoped to the one job that needs it
  # (record-validation, which comments on the `[url-watchdog] status` meta
  # issue). A job-level permissions block REPLACES this one, so that job lists
  # its own (contents: read + issues: write) explicitly.

on:
  pull_request:
  push:
    branches: [main]
  # Required checks must also run on the merge-queue's temporary branch when
  # a PR lands via the queue (Settings → merge queue) — see docs/DEVELOPING.md.
  merge_group:
  # Manual dispatch (ADR 0021): `browser` filters the browser-matrix to one
  # leg (the manual escape — test a browser whose installer CI cannot fetch;
  # pair with the temporary ci-downloads release via pnpm ci:download).
  # `version` pins the resolver so the run works with the vendor API fully
  # down. A partial dispatch skips record-validation (see that job).
  workflow_dispatch:
    inputs:
      browser:
        description: 'Single browser to test (librewolf|floorp|zen|waterfox); all = default matrix'
        type: choice
        default: 'all'
        options:
          - all
          - librewolf
          - floorp
          - zen
          - waterfox
      version:
        description: 'Pin the browser version (empty = resolve the newest)'
        type: string
        default: ''

concurrency:
  # Manual escapes get their own group: a routine push must never cancel a
  # deliberate single-browser run (the vendor APIs may be down — that's the
  # whole point of the escape).
  group:
    e2e-${{ github.event_name == 'workflow_dispatch' && inputs.browser != 'all' && inputs.browser !=
    '' && format('escape-{0}', inputs.browser) || github.ref }}
  # A single-browser manual escape must not be cancelled by a routine push:
  # it only ever runs from workflow_dispatch, where runs are rare and deliberate.
  cancel-in-progress:
    ${{ github.event_name != 'workflow_dispatch' || inputs.browser == '' || inputs.browser == 'all'
    }}

jobs:
  # ── Changed-paths filter ──────────────────────────────────────────────────
  # Docs-only / tooling-only PRs skip every E2E job (snapshot, installer,
  # helper, updater, browser-matrix): nothing that builds or runs them changed.
  # Only `changes` and the always-running `e2e-gate` report, so the required
  # check never goes missing. See docs/DEVELOPING.md → Continuous integration.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.filter.outputs.installer }}
      # A FULL manual dispatch (browser input '' or 'all') means "re-validate
      # the current releases against main" — the post-release escape that
      # re-records the validated versions the publish gate requires (#4). The
      # path filter sees no commit diff on dispatch, so forcing updater=true
      # here makes the helper/updater/portable-firefox legs run; a partial
      # single-browser dispatch does NOT force it (ADR 0021) — its snapshot +
      # browser-matrix legs are forced by their own job-level escape conditions
      # instead (the snapshot needs-cascade would otherwise skip the whole
      # matrix, see #143).
      updater:
        ${{ steps.filter.outputs.updater == 'true' || (github.event_name == 'workflow_dispatch' &&
        (inputs.browser == '' || inputs.browser == 'all')) }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            installer:
              - 'installer/**'
              - 'test/e2e/installer/**'
              - '.github/workflows/e2e.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            updater:
              - 'core/chrome/utils/updater/**'
              - 'installer/src/helper/**'
              - 'test/e2e/updater/**'
              - 'test/e2e/shared/**'
              - '.github/workflows/e2e.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            core:
              - 'core/**'
              - 'test/e2e/core/**'
              - '.github/workflows/e2e.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # ── Dev snapshot (built ONCE per run, shared across all updater legs) ────
  # The package zips + hashes.json are OS-independent, so one ubuntu build
  # serves every updater leg. A LOCAL-mode build bakes the BUILDER's dist dir
  # into utils.zip's generated config (part of the hashed file set), so on a
  # different OS the test repoints the updater at its own copy via
  # extensions.firefox-scripts.override.<KEY> prefs (localConfigOverrides in
  # test/e2e/shared/helpers.mjs) — never by rewriting the config, which would
  # flip the package hash and break the staleness check.
  snapshot:
    name: build dev snapshot
    needs: changes
    # A single-browser dispatch (the watchdog's new-release leg, or ci:download)
    # must build the snapshot too: browser-matrix needs it, and a needs-chain
    # skip is transitive — without this, the escape dispatch ran nothing
    # (#143 proof run 34033626251).
    if:
      needs.changes.outputs.updater == 'true' || needs.changes.outputs.core == 'true' ||
      github.event_name == 'workflow_dispatch' && inputs.browser != 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup-repo

      - name: Build snapshot
        run: pnpm upload:local --mode=dev

      - name: Upload dev snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-snapshot
          path: dist/
          if-no-files-found: error

  # ── Installer E2E ──────────────────────────────────────────────────────────
  installer:
    name: 'installer E2E · ${{ matrix.os }}'
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: $/.github/actions/setup-repo

      - name: Build snapshot
        run: pnpm upload:local --mode=dev

      # The UI layer launches a real Firefox (even headless it needs a display
      # server on Linux runners), so install xvfb and run under it — same as
      # the updater job below.
      - name: Install Linux test prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Run installer E2E (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        # -a picks a free display number, avoiding collisions with the
        # updater E2E job that also runs under xvfb-run on the same runner.
        run: xvfb-run -a node test/e2e/installer/installer-e2e.mjs --ui --headless

      - name: Run installer E2E (macOS/Windows)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: node test/e2e/installer/installer-e2e.mjs --ui --headless

  # ── Helper E2E (Linux elevated-copy core) ──────────────────────────────────
  helper:
    name: 'helper E2E · ${{ matrix.os }}'
    needs: changes
    if: needs.changes.outputs.updater == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: $/.github/actions/setup-repo

      - name: Build helper binary
        run: |
          mkdir -p dist/installer
          make -C installer helper_linux MODE=dev

      - name: Test elevated copy (sudo)
        run: |
          echo "hello" > /tmp/test_src.txt
          sudo ./dist/installer/helper_linux-dev /tmp/test_src.txt /etc/fxs-e2e-test.txt
          diff /tmp/test_src.txt /etc/fxs-e2e-test.txt
          sudo rm /etc/fxs-e2e-test.txt
          rm /tmp/test_src.txt

  # ── Updater E2E ────────────────────────────────────────────────────────────
  # Every leg is required: the updater must work on Firefox stable AND Firefox
  # Developer Edition across the supported OS matrix (#35 — Dev Edition is
  # first-party Mozilla, so it is hard-gated like stable, unlike the forks).
  updater:
    name: 'updater E2E · ${{ matrix.browser }} · ${{ matrix.os }}'
    needs: [changes, snapshot]
    if: needs.changes.outputs.updater == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: firefox, os: ubuntu-latest}
          - {browser: firefox, os: macos-latest}
          - {browser: firefox, os: windows-latest}
          - {browser: firefox-dev, os: ubuntu-latest}
          - {browser: firefox-dev, os: macos-latest}
          - {browser: firefox-dev, os: windows-latest}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: $/.github/actions/setup-repo

      # The ~100 MB official Firefox download is the bulk of the install step;
      # cache it keyed on the exact download URL (which embeds the release
      # version — Firefox stable bumps ~monthly, invalidating the key). Only the
      # downloaded installer is cached; the install itself still runs per job.
      # BROWSER_DL_DIR is exported here (step context, where ${{ runner.temp }}
      # is valid) so downloads.mjs saves into the cache-backed dir.
      - name: Resolve Firefox download URL
        id: ffurl
        shell: bash
        run: |
          URL=$(node test/e2e/shared/downloads.mjs ${{ matrix.browser }} --url)
          KEY=$(node --input-type=module -e "import {createHash} from 'node:crypto'; console.log(createHash('sha256').update(process.argv[1]).digest('hex').slice(0, 16))" "$URL")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=firefox-dl-${{ runner.os }}-$KEY" >> "$GITHUB_OUTPUT"
          echo "BROWSER_DL_DIR=${{ runner.temp }}/browser-dl" >> "$GITHUB_ENV"
      - name: Cache Firefox installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BROWSER_DL_DIR }}
          key: ${{ steps.ffurl.outputs.key }}

      # Linux needs xvfb for the BiDi run. The browser itself always comes
      # from downloads.mjs's official recipe (apt's Snap wrapper breaks BiDi);
      # it downloads via the official channel redirect and exports
      # FIREFOX_BINARY through $GITHUB_ENV.
      - name: Install Linux test prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Install ${{ matrix.browser }}
        run: node test/e2e/shared/downloads.mjs ${{ matrix.browser }}

      # Restores dist/dev-<branch>-<sha>/ built once by the `snapshot` job.
      # On non-ubuntu legs the baked LOCAL_DIST_PATH differs from this
      # runner's, so the test sets the override prefs (localConfigOverrides)
      # to point the updater at this copy.
      - name: Download dev snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      # The test builds its own fresh temp profile from the dev snapshot, so no
      # profile-seed step is needed. It reads FIREFOX_BINARY (set by the install
      # step above) and auto-discovers the snapshot dir.
      - name: Run updater E2E (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a node test/e2e/updater/updater-e2e.mjs

      - name: Run updater E2E (macOS)
        if: matrix.os == 'macos-latest'
        run: node test/e2e/updater/updater-e2e.mjs

      - name: Run updater E2E (Windows)
        if: matrix.os == 'windows-latest'
        run: node test/e2e/updater/updater-e2e.mjs

      # Ground truth of what THIS leg validated. Mozilla's "latest" redirects
      # embed no version in the URL, so the tested release can only be read
      # from the installed binary (downloads.mjs --installed-version, which
      # falls back to application.ini). Matrix job outputs do not aggregate on
      # GitHub (limitation #17245), so the version travels as a tiny per-leg
      # artifact that the record-validation job downloads. These steps run
      # only after the E2E above passed (failure stops the step chain).
      - name: Capture installed ${{ matrix.browser }} version
        id: instver
        shell: bash
        run: |
          VER="$(node test/e2e/shared/downloads.mjs ${{ matrix.browser }} --installed-version)"
          echo "Tested ${{ matrix.browser }} $VER on ${{ matrix.os }}"
          printf '{"browser":"%s","os":"%s","version":"%s"}\n' \
            "${{ matrix.browser }}" "${{ matrix.os }}" "$VER" \
            > "e2e-version-${{ matrix.browser }}-${{ matrix.os }}.json"

      - name: Upload ${{ matrix.browser }} version artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-version-${{ matrix.browser }}-${{ matrix.os }}
          path: e2e-version-${{ matrix.browser }}-${{ matrix.os }}.json
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.browser }}-${{ matrix.os }}
          path: |
            dist/updater-e2e-*.png
            dist/installer-e2e-*.png
          if-no-files-found: ignore

  # ── Portable Firefox Release E2E (#56) ────────────────────────────────────
  # Firefox Release is installed into a runner-temp custom directory rather
  # than Program Files, /Applications, or a package-managed location. The
  # existing installer and updater tests then exercise detection, GreD
  # discovery, installation, and updater-tab behavior against that binary.
  portable-firefox:
    name: 'portable Firefox E2E · ${{ matrix.os }}'
    needs: [changes, snapshot]
    if: needs.changes.outputs.updater == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      # $/ prefix: the runner materializes the local action from the triggering
      # commit — a ./ local action would need a checkout step first.
      - uses: $/.github/actions/setup-repo

      - name: Set portable browser directory (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          echo "PORTABLE_BROWSER_DIR=${{ runner.temp }}/firefox-portable" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/firefox-portable"

      - name: Set portable browser directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'firefox-portable'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "PORTABLE_BROWSER_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve Firefox Release download URL (Linux/macOS)
        id: portable-url-unix
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          URL=$(node test/e2e/shared/downloads.mjs firefox --url)
          KEY=$(node --input-type=module -e "import {createHash} from 'node:crypto'; console.log(createHash('sha256').update(process.argv[1]).digest('hex').slice(0, 16))" "$URL")
          echo "key=firefox-portable-${{ runner.os }}-$KEY" >> "$GITHUB_OUTPUT"
          echo "BROWSER_DL_DIR=${{ runner.temp }}/browser-dl" >> "$GITHUB_ENV"

      - name: Resolve Firefox Release download URL (Windows)
        id: portable-url-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = node test/e2e/shared/downloads.mjs firefox --url
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($url)
          $sha = [System.Security.Cryptography.SHA256]::HashData($bytes)
          $key = ([Convert]::ToHexString($sha)).ToLowerInvariant().Substring(0, 16)
          "key=firefox-portable-${{ runner.os }}-$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "BROWSER_DL_DIR=$(Join-Path $env:RUNNER_TEMP 'browser-dl')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Firefox Release download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BROWSER_DL_DIR }}
          key: ${{ steps.portable-url-unix.outputs.key || steps.portable-url-windows.outputs.key }}

      - name: Install Firefox Release portably (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: node test/e2e/shared/downloads.mjs firefox

      - name: Install Firefox Release portably (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node test/e2e/shared/downloads.mjs firefox

      - name: Assert portable layout (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          case "$FIREFOX_BINARY" in
            "$PORTABLE_BROWSER_DIR"/*) ;;
            *) echo "::error::Firefox binary is not inside portable directory: $FIREFOX_BINARY"; exit 1 ;;
          esac
          test -f "$FIREFOX_BINARY"
          echo "Portable Firefox: $FIREFOX_BINARY"

      - name: Assert portable layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:FIREFOX_BINARY.StartsWith($env:PORTABLE_BROWSER_DIR, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Firefox binary is not inside portable directory: $env:FIREFOX_BINARY"
          }
          if (-not (Test-Path -LiteralPath $env:FIREFOX_BINARY -PathType Leaf)) {
            throw "Firefox binary not found: $env:FIREFOX_BINARY"
          }
          Write-Host "Portable Firefox: $env:FIREFOX_BINARY"

      - name: Download dev snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      # The shared snapshot is built on Ubuntu and therefore contains only the
      # Linux installer. Build the native installer locally for this runner;
      # package zips remain sourced from the shared snapshot.
      - name: Build native installer
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) make -C installer dist_linux MODE=dev ;;
            macOS) make -C installer dist_mac MODE=dev ;;
            Windows) make -C installer dist_win MODE=dev ;;
          esac
          case "${{ runner.os }}" in
            Linux) echo "INSTALLER_BIN=$PWD/installer/../dist/installer/installer_linux-dev" >> "$GITHUB_ENV" ;;
            macOS) echo "INSTALLER_BIN=$PWD/installer/../dist/installer/installer_mac-dev" >> "$GITHUB_ENV" ;;
            # github.workspace expands to a native Windows path (D:\a\...);
            # $PWD would be MSYS-style (/d/a/...) which Node's fs cannot use.
            Windows) echo "INSTALLER_BIN=${{ github.workspace }}\\dist\\installer\\installer_win-dev.exe" >> "$GITHUB_ENV" ;;
          esac
          chmod +x dist/installer/installer_* 2>/dev/null || true

      - name: Install Linux test prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Run portable installer E2E (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: xvfb-run -a node test/e2e/installer/installer-e2e.mjs --ui --headless

      - name: Run portable installer E2E (macOS/Windows)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: node test/e2e/installer/installer-e2e.mjs --ui --headless

      - name: Run portable updater E2E (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: xvfb-run -a node test/e2e/updater/updater-e2e.mjs

      - name: Run portable updater E2E (macOS/Windows)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: node test/e2e/updater/updater-e2e.mjs

      # Same failure diagnostics as the installer/updater jobs: the E2E
      # harness leaves failure screenshots in dist/ for artifact upload.
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-portable-firefox-${{ matrix.os }}
          path: |
            dist/installer-e2e-*.png
            dist/updater-e2e-*.png
          if-no-files-found: ignore

  # ── Snap Firefox E2E (#55) ─────────────────────────────────────────────────
  # Ubuntu's default Firefox packaging is a snap; every other leg installs the
  # official tarball, so the snap build was never exercised and its GreD was
  # unverified (future-work §2.1 marked it "open"). This leg installs Firefox
  # through the snap store, verifies the actual GreD path, and runs the
  # installer (HTTP+UI detection) and updater E2E against the snap binary.
  #
  # ADVISORY in the gate: hosted runners may lack snapd or block store
  # downloads, and the snap refresh cycle is outside our control. Skipped
  # quietly when snapd is unavailable.
  snap-firefox:
    name: 'snap Firefox E2E · ubuntu-latest'
    needs: [changes, snapshot]
    if: needs.changes.outputs.updater == 'true'
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: $/.github/actions/setup-repo

      # Availability gate: skip the whole leg when the runner has no working
      # snapd (advisory — availability varies by runner image, #55).
      - name: Check snapd availability
        id: snapd
        run: |
          if command -v snap >/dev/null 2>&1 && sudo snap list >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "snapd is available"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::snapd unavailable on this runner — snap E2E leg skipped (#55)"
          fi

      - name: Install Linux test prerequisites
        if: steps.snapd.outputs.available == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      # The snap store resolves the revision at install time (no cacheable
      # URL, so no actions/cache step here); downloads.mjs wraps
      # `sudo snap install firefox --classic` (it elevates the snap command
      # itself — running this recipe under sudo would strip $GITHUB_ENV and
      # FIREFOX_BINARY would never reach the later steps) and exports
      # /snap/bin/firefox.
      - name: Install Firefox (snap)
        if: steps.snapd.outputs.available == 'true'
        run: node test/e2e/shared/downloads.mjs firefox-snap

      # THE point of this leg (#55): discover the snap GreD at runtime —
      # findGreDir() maps a /snap/ binary to /etc/firefox — and verify it
      # against the actual snap mount before any test relies on it. Findings
      # land in the step summary so the future-work §2.1 row can be closed.
      - name: Verify snap GreD
        if: steps.snapd.outputs.available == 'true'
        run: |
          set -euo pipefail
          BIN="$FIREFOX_BINARY"
          test -x "$BIN" || { echo "::error::snap Firefox binary missing: $BIN"; exit 1; }
          # One single-quoted-script string: a second quoted fragment would
          # become argv[1] and shift $BIN to argv[2] (that bug made GRED
          # empty in the first CI run).
          GRED=$(node --input-type=module -e "import {findGreDir} from './test/e2e/shared/browsers.mjs'; console.log(findGreDir(process.argv[1]))" "$BIN")
          echo "binary: $BIN"
          echo "findGreDir(): $GRED"
          echo "### Snap Firefox GreD verification (#55)" >> "$GITHUB_STEP_SUMMARY"
          echo "| probe | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| FIREFOX_BINARY | \`$BIN\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| findGreDir() | \`$GRED\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -d /etc/firefox ]; then
            echo "/etc/firefox exists → documented GreD target confirmed for this snap build"
            echo "| /etc/firefox exists | yes |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "/etc/firefox does NOT exist — findGreDir() must be reconciled with the actual path"
            echo "| /etc/firefox exists | no |" >> "$GITHUB_STEP_SUMMARY"
            echo "| snap mount | \`$(snap run --shell firefox -c 'echo $SNAP' 2>/dev/null || echo n/a)\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Hard assertion: whatever findGreDir() returns must exist as a
          # directory after the snap install (user-writable config dir is
          # created on first run or by the package itself).
          test -d "$GRED" || {
            echo "::error::findGreDir() returned a non-existent dir for the snap binary: $GRED"
            exit 1
          }

      - name: Download dev snapshot
        if: steps.snapd.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      # Same as the portable-firefox job: the shared snapshot is built on
      # Ubuntu but artifact upload/download drops the execute bit, so build
      # the native installer locally (package zips stay from the snapshot).
      - name: Build native installer
        if: steps.snapd.outputs.available == 'true'
        run: |
          make -C installer dist_linux MODE=dev
          chmod +x dist/installer/installer_linux-dev
          # findInstaller() prefers INSTALLER_BIN: the E2E looks in the
          # SNAPSHOT dir (dist/dev-HEAD-<sha>/), where the artifact copy
          # lacks the execute bit — point it at the freshly built binary.
          echo "INSTALLER_BIN=$PWD/dist/installer/installer_linux-dev" >> "$GITHUB_ENV"

      # Snap-environment preparation for the two E2E runs:
      #
      # 1. WRITABLE GreD — the tabmixplus-docs installation guide says snap
      #    users copy config.js into /etc/firefox and "may have to create the
      #    sub folders defaults/pref" themselves; on the runner /etc/firefox
      #    is root-owned, so chown it to the runner user (the production
      #    analog is the updater's admin-copy path, which stays on the manual
      #    checklist — here we make the SEED writable so the harness can
      #    exercise the flow it is supposed to test).
      # 2. SNAP-ACCESSIBLE TMP — a strictly-confined snap Firefox cannot read
      #    /tmp (karma-firefox-launcher#183), so the E2E's os.tmpdir() test
      #    profiles are invisible to it ("Could not find profile folder").
      #    Point TMPDIR into $HOME, which the snap's home interface allows.
      - name: Prepare snap environment
        if: steps.snapd.outputs.available == 'true'
        run: |
          sudo chown -R "$(id -un):$(id -gn)" /etc/firefox
          mkdir -p /etc/firefox/defaults/pref
          mkdir -p "$HOME/tmp"
          echo "TMPDIR=$HOME/tmp" >> "$GITHUB_ENV"

      # Detection against the snap build (HTTP + UI layers + the test-surface
      # layer from #129): the installer must discover /snap/bin/firefox and
      # report it like any other browser.  The UI layer runs HEADED under xvfb
      # (real-user mode) with --ui-fallback-open: the installer's cross-process
      # relaunch cannot hand its URL into a BiDi-driven SNAP instance under CI
      # (headless and headed, unconfined and snap-wrapped relaunch all fail on
      # this leg; the tarball legs hand off fine), so when no tab surfaces the
      # harness opens the installer's own UI URL in-process and the UI
      # assertions (cards, badges, screenshot) still run.  The relaunch caveat
      # is documented in docs/future-work.md §2.
      - name: Run installer E2E (snap Firefox)
        if: steps.snapd.outputs.available == 'true'
        run: xvfb-run -a node test/e2e/installer/installer-e2e.mjs --ui --ui-fallback-open

      # Updater flow against the snap build: tab opens, config seeds into the
      # (now runner-owned) /etc/firefox GreD, status renders. Elevation into
      # a root-owned GreD stays on the manual release checklist (future-work
      # §2) — the admin-copy path cannot be automated on hosted runners.
      # Runs even when the installer step above failed: each half of the leg
      # reports independently, so one failure never hides the other's result.
      - name: Run updater E2E (snap Firefox)
        if: always() && steps.snapd.outputs.available == 'true'
        run: xvfb-run -a node test/e2e/updater/updater-e2e.mjs

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-snap-firefox
          path: |
            dist/installer-e2e-*.png
            dist/updater-e2e-*.png
          if-no-files-found: ignore

  # ── Browser matrix (advisory, Windows) ────────────────────────────────────
  # Each browser resolves its installer through test/e2e/shared/browserResolver.mjs:
  # LibreWolf (Codeberg bsys6 → packages API; librewolf.dev → dl.librewolf.net
  # → bsys6 asset → ci-downloads → cached installer), Floorp and Zen (GitHub
  # stable latest asset URLs), Waterfox (its CDN versioned setup URL — the leg
  # is ADVISORY during its soak period, ADR 0021). Firefox Dev Edition is NOT
  # here — it is first-party Mozilla and runs as a required leg of the
  # `updater` job above.
  browser-matrix:
    name: 'updater E2E · ${{ matrix.browser }} · windows-latest'
    # Same updater E2E test as the `updater` job, so it is gated on the same
    # changed-paths filter (skips on docs-only / tooling-only PRs). The legs
    # stay ADVISORY in the gate: their failures warn instead of blocking.
    needs: [changes, snapshot]
    if:
      needs.changes.outputs.updater == 'true' || needs.changes.outputs.core == 'true' ||
      github.event_name == 'workflow_dispatch' && inputs.browser != 'all'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # Manual escape: a `browser` input collapses the matrix to that one leg
      # (dynamic JSON matrix — the canonical fromJSON pattern). Empty input
      # (or any non-dispatch event, where `inputs` is empty) = the full matrix.
      matrix:
        browser:
          ${{ fromJSON(inputs.browser != '' && inputs.browser != 'all' && format('["{0}"]',
          inputs.browser) || '["librewolf", "floorp", "zen", "waterfox"]') }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Manual escape: pin the resolver to the requested version (empty input
      # = resolve the newest). Pinned version + ci-downloads release works even
      # with the vendor API fully down.
      BROWSER_PIN_VERSION: ${{ inputs.version }}

    steps:
      - uses: $/.github/actions/setup-repo

      # The ~100 MB installers dominate the job; cache them keyed on the
      # resolved download URL (embeds the version for LibreWolf/Waterfox).
      # Floorp/Zen's stable latest URLs keep a constant key — downloadTo()
      # re-fetches when the remote size changes, and save-always re-caches.
      - name: Resolve download URL
        id: dlurl
        shell: bash
        run: |
          URL=$(node test/e2e/shared/downloads.mjs ${{ matrix.browser }} --url)
          KEY=$(node --input-type=module -e "import {createHash} from 'node:crypto'; console.log(createHash('sha256').update(process.argv[1]).digest('hex').slice(0, 16))" "$URL")
          echo "key=browser-dl-${{ runner.os }}-${{ matrix.browser }}-$KEY" >> "$GITHUB_OUTPUT"
          echo "BROWSER_DL_DIR=${{ runner.temp }}/browser-dl" >> "$GITHUB_ENV"
      - name: Cache ${{ matrix.browser }} installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BROWSER_DL_DIR }}
          key: ${{ steps.dlurl.outputs.key }}
          save-always: true

      # downloads.mjs installs via the official recipe and resolves the real
      # binary from install dirs (never a PATH shim or app-execution alias,
      # whose parent dir is not the browser's GreD), exporting FIREFOX_BINARY.
      - name: Install ${{ matrix.browser }}
        run: node test/e2e/shared/downloads.mjs ${{ matrix.browser }}

      # Restores dist/dev-<branch>-<sha>/ built by the `snapshot` job. The
      # ubuntu snapshot's baked LOCAL_DIST_PATH differs from this Windows
      # runner's, so the test sets the override prefs (localConfigOverrides)
      # to point the updater at this copy.
      - name: Download dev snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      - name: Run updater E2E
        run: node test/e2e/updater/updater-e2e.mjs

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.browser }}
          path: dist/updater-e2e-*.png
          if-no-files-found: ignore

  # ── E2E gate ─────────────────────────────────────────────────────────────
  # Single branch-protection check. Every upstream job is a hard gate, so a
  # green aggregate check cannot hide a failed, cancelled, or skipped matrix
  # leg. The verify logic (required / advisory / skip-guard) lives in the
  # shared .github/actions/verify-gate engine, kept consistent with ci-gate.
  # `pnpm check:gates` enforces this needs list.
  e2e-gate:
    name: E2E gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        changes,
        snapshot,
        installer,
        helper,
        updater,
        portable-firefox,
        snap-firefox,
        browser-matrix,
      ]
    steps:
      # Local action — a fresh runner needs the repo checked out first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/verify-gate
        with:
          changes-result: ${{ needs.changes.result }}
          # e2e-gate always verifies: per-job applicability decides which jobs
          # must pass vs. must be skipped (no single branchKey anymore).
          # Keep applicability/results entries bare — the gate-coverage checker
          # parses 12-space `name:` pairs only (no comment lines inside).
          branch: true
          branch-label: E2E-relevant changes
          # snap-firefox is additionally availability-gated at runtime (snapd
          # probe): the gate treats it as advisory, so a runner without snapd
          # cannot block a merge.
          applicability: |-
            snapshot:${{ (needs.changes.outputs.updater == 'true' || needs.changes.outputs.core == 'true') || (github.event_name == 'workflow_dispatch' && inputs.browser != 'all') }}
            installer:${{ needs.changes.outputs.installer == 'true' }}
            helper:${{ needs.changes.outputs.updater == 'true' }}
            updater:${{ needs.changes.outputs.updater == 'true' }}
            portable-firefox:${{ needs.changes.outputs.updater == 'true' }}
            snap-firefox:${{ needs.changes.outputs.updater == 'true' }}
            browser-matrix:${{ (needs.changes.outputs.updater == 'true' || needs.changes.outputs.core == 'true') || (github.event_name == 'workflow_dispatch' && inputs.browser != 'all') }}
          # Literal block: prettier leaves `|` content alone, so each pair
          # stays on its own line and no ${{ }} expression is ever split.
          # verify.sh splits the value on whitespace, newlines included.
          results: |-
            snapshot:${{ needs.snapshot.result }}
            installer:${{ needs.installer.result }}
            helper:${{ needs.helper.result }}
            updater:${{ needs.updater.result }}
            portable-firefox:${{ needs.portable-firefox.result }}
            snap-firefox:${{ needs.snap-firefox.result }}
            browser-matrix:${{ needs.browser-matrix.result }}
          required: snapshot installer helper updater portable-firefox
          advisory: snap-firefox browser-matrix
          skip-guard: snapshot installer helper updater portable-firefox snap-firefox browser-matrix

  # ── Record validated browser versions (#4) ────────────────────────────────
  # After the updater matrix legs (firefox/firefox-dev × 3 OSes) ran and
  # passed, record the EXACT versions those legs installed into
  # .watchdog-validated/ (Actions cache, rotating key — same pattern as the
  # watchdog baseline; a dedicated dir so the publish pre-flight's baseline
  # restore can never clobber it). The prod publish pre-flight requires the
  # current releases to be covered by this record, so a watchdog baseline
  # refresh alone cannot satisfy the drift gate: the shipped browser versions
  # must have a passing E2E run.
  record-validation:
    name: record validated browser versions
    # `updater` is needed directly because this job must prove the legs
    # ACTUALLY RAN: needs.updater.result aggregates the whole matrix, so a
    # 'success' means all six firefox/firefox-dev legs ran and passed. A
    # core-only main push (updater legs path-skipped → result 'skipped') no
    # longer records — without a test run, re-resolving live versions would
    # claim untested releases as E2E-validated (#134 review finding 5).
    needs: [e2e-gate, updater]
    # `always() &&` intentionally overrides the needs-graph skip rules. The
    # gate itself runs via if: always() and can succeed while a path-filtered
    # sibling (installer legs) was skipped; since ~2026-08-29 a needs entry
    # in state 'skipped' then makes THIS job skip too, even though its own
    # condition holds (byte-identical workflow ran the job on 08-29 12:40 and
    # 17:01, skipped ever since — GitHub-side evaluation change). With
    # always() the result comparisons below still decide the outcome, so the
    # job records only runs whose updater legs really validated.
    #
    # Partial-dispatch guard (ADR 0021): a single-browser manual escape
    # (workflow_dispatch with `browser` set) must NOT record — it validated
    # only one fork, and overwriting the record could let the publish gate
    # ship a firefox/firefox-dev release that no full run ever tested.
    if: >-
      always() && needs.e2e-gate.result == 'success' && needs.updater.result == 'success' &&
      github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' &&
      inputs.browser != '' && inputs.browser != 'all')
    runs-on: ubuntu-latest
    # Only this job touches issues (meta-issue comment). Job-level permissions
    # REPLACE the workflow-level block, so contents: read (checkout, scripts)
    # must be listed here as well — not just issues: write.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The exact tested versions arrive as per-leg artifacts from the updater
      # matrix legs (matrix outputs do not aggregate — GitHub limitation
      # #17245, hence files). Each leg uploads e2e-version-<browser>-<os>.json;
      # flatten them into .e2e-versions/ for the recorder.
      - name: Download tested versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-version-*
          path: .e2e-versions
          merge-multiple: true
      - name: Record validated browser versions
        env:
          VALIDATED_DIR: .watchdog-validated
          E2E_VERSIONS_DIR: .e2e-versions
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/record-validated-versions.mjs
      - name: Save validated-versions record
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog-validated
          key: browser-validated-${{ github.run_id }}
          save-always: true

  # ── Manual-escape cleanup (ADR 0021) ─────────────────────────────────────
  # A single-browser dispatch may consume an installer from the temporary
  # `ci-downloads` release (created on demand by pnpm ci:download). This job
  # deletes the consumed asset afterwards — and the release + tag once empty —
  # so the steady state is "the ci-downloads release does not exist". Runs
  # only for partial manual escapes, never on push/PR. A FAILED leg still
  # cleans up (!cancelled); a CANCELLED one leaves the installer for the
  # immediate retry.
  cleanup-ci-downloads:
    name: cleanup ci-downloads release
    needs: [e2e-gate]
    # Runs after the gate (post-gate job): a failed advisory leg still cleans
    # up (the gate reports advisory failures without blocking, so a green or
    # warning gate both proceed here); a CANCELLED run skips this job outright
    # (GitHub cancels pending needs-jobs), leaving the installer for the retry.
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.browser != '' && inputs.browser
      != 'all' && needs.e2e-gate.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete the release asset + release + tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete consumed ci-downloads asset (and release when empty)
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER: ${{ inputs.browser }}
          VERSION: ${{ inputs.version }}
        run: node tools/ci/cleanupCiDownloads.mjs
