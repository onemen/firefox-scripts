# E2E test matrix
#
# Installer E2E: builds the installer, starts it headless, exercises the
# HTTP API (token gate, gated routes, status). Hard gate on all 3 OSes.
#
# Helper E2E: builds + tests the elevated-copy helper binary under sudo
# (Linux only).  The OS elevation prompt cannot be automated, but the copy
# core — including the defaults/pref directory walk-up — is tested here.
#
# Updater E2E: uses the shared dev snapshot (built once by the `snapshot`
# job), installs Firefox, creates a test profile with scripts, launches
# Firefox via puppeteer-core + WebDriver BiDi, and asserts the updater tab
# renders the correct state. The Firefox stable/Dev/Nightly legs and the
# required waterfox leg are hard gates; the fork and snap legs are advisory.
#
# Per-job inventory: docs/ci-inventory.md — https://github.com/onemen/firefox-scripts/issues/3

name: E2E

permissions:
  contents: read
  # No workflow-level issues: write — every E2E job runs build/test code from
  # the PR, so issue-write access must be scoped to the one job that needs it
  # (record-validation, which comments on the `[url-watchdog] status` meta
  # issue). A job-level permissions block REPLACES this one, so that job lists
  # its own (contents: read + issues: write) explicitly.

# Browser-installer download budget (test/e2e/shared/downloads.mjs). Its default
# is 20 min — exactly the `timeout-minutes` every browser leg carries — so a slow
# transfer used to consume the whole leg and surface as a bare job cancellation:
# no message naming the browser, no budget error, and no chance for the
# cached-installer fallback (findCachedInstaller) to engage. Observed 2026-09-22
# on PR #294's librewolf leg: 160 MB at 51-61 KB/s, cancelled at the cap having
# fetched ~60 MB. 12 min leaves ~8 min inside the 20-minute legs for the install
# + scenarios + that fallback, while a healthy-but-slow transfer (0.3 MB/s, the
# slowest measured) still completes well inside it.
# The invariant — budget + slack < every downloading leg's timeout — is enforced
# by test/unit/tools/download-budget.test.mjs.
env:
  DOWNLOAD_TOTAL_BUDGET_MS: '720000'

on:
  pull_request:
  push:
    branches: [main]
  # Required checks must also run on the merge-queue's temporary branch when
  # a PR lands via the queue (Settings → merge queue) — see docs/DEVELOPING.md.
  merge_group:
  # Weekly cadence for the legs whose vendor is the flakiest link and whose
  # coverage does not need per-PR freshness (the snap leg: store CDN 502s and
  # snapd self-refresh deadlocks cost ~4 min per updater-PR and, being
  # advisory, never gated anything). Scheduled runs exercise it on a timer; a
  # red scheduled snap leg still shows up as the usual advisory failure.
  schedule:
    - cron: '30 5 * * 1' # Monday 05:30 UTC — ahead of the url-watchdog (06:00)
  # Manual dispatch (ADR 0021): `browser` filters the browser-matrix to one
  # leg (the manual escape — test a browser whose installer CI cannot fetch;
  # pair with the temporary ci-downloads release via pnpm ci:download).
  # `version` pins the resolver so the run works with the vendor API fully
  # down. A partial dispatch skips record-validation (see that job).
  workflow_dispatch:
    inputs:
      browser:
        description: >-
          Single browser to test (librewolf|floorp|zen|waterfox|firefox-esr); all = default matrix.
          firefox-esr runs the full dynamic ESR matrix (both watched majors) from the watchdog
          baseline.
        type: choice
        default: 'all'
        options:
          - all
          - librewolf
          - floorp
          - zen
          - waterfox
          - firefox-esr
      version:
        description: 'Pin the browser version (empty = resolve the newest)'
        type: string
        default: ''

concurrency:
  # Manual escapes get their own group: a routine push must never cancel a
  # deliberate single-browser run (the vendor APIs may be down — that's the
  # whole point of the escape).
  group:
    e2e-${{ github.event_name == 'workflow_dispatch' && inputs.browser != 'all' && inputs.browser !=
    '' && format('escape-{0}', inputs.browser) || github.ref }}
  # A single-browser manual escape must not be cancelled by a routine push:
  # it only ever runs from workflow_dispatch, where runs are rare and deliberate.
  cancel-in-progress:
    ${{ github.event_name != 'workflow_dispatch' || inputs.browser == '' || inputs.browser == 'all'
    }}

jobs:
  # ── Changed-paths filter ──────────────────────────────────────────────────
  # Docs-only / tooling-only PRs skip every E2E job (snapshot, installer,
  # helper, updater, browser-matrix): nothing that builds or runs them changed.
  # Only `changes` and the always-running `e2e-gate` report, so the required
  # check never goes missing. See docs/DEVELOPING.md → Continuous integration.
  changes:
    name: detect changed paths
    runs-on: ubuntu-24.04
    # Job-level timeouts (belt-and-suspenders, all jobs here): GitHub's
    # default is 360 min — a wedged job would hang until then. The values
    # are multiples of the slowest observed green run per group (see
    # docs/ci-inventory.md → Job timeouts).
    timeout-minutes: 5
    outputs:
      # Path filters are meaningful only where a commit diff exists (PR, push,
      # merge queue). On workflow_dispatch dorny/paths-filter diffs the head
      # commit against its parent — an arbitrary diff that made installer/
      # updater/core legs run on unrelated browser escapes (observed 2026-09-19:
      # a zen escape ran the full Firefox matrix because HEAD's parent was the
      # #254 merge). So every path-based output is dispatch-guarded:
      #   partial single-browser dispatch → forces NOTHING path-based (ADR 0021;
      #     its snapshot + collapsed browser legs are forced by job-level escape
      #     conditions — the snapshot needs-cascade would otherwise skip the
      #     whole matrix, see #143);
      #   FULL dispatch (browser '' or 'all') → forces the complete
      #     revalidation set (installer + updater legs + core lifecycle): the
      #     post-release "re-validate the current releases against main" escape
      #     that re-records the validated versions the publish gate requires
      #     (#4). ESR is deliberately NOT forced — it tracks Firefox back-compat,
      #     not our releases, and runs on its own dedicated dispatch.
      installer:
        ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.installer == 'true')
        || (github.event_name == 'workflow_dispatch' && (inputs.browser == '' || inputs.browser ==
        'all')) }}
      updater:
        ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.updater == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.browser == '' || inputs.browser ==
        'all')) }}
      core:
        ${{ (github.event_name != 'workflow_dispatch' && steps.filter.outputs.core == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.browser == '' || inputs.browser ==
        'all')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            installer:
              - 'installer/**'
              # Snapshot-shaping tooling (same rationale as the updater filter):
              # the installer leg asserts the snapshot binary's baked LOCAL
              # identity (2026-09-25 regression class).
              - 'tools/publish/upload.mjs'
              - 'tools/publish/syncGeneratedFiles.mjs'
              - 'tools/publish/publishMode.mjs'
              - 'config/installer.conf'
              - 'test/e2e/installer/**'
              - '.github/workflows/e2e.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            updater:
              - 'core/chrome/utils/updater/**'
              - 'installer/src/helper/**'
              # updater-ui.zip sources — remote-ui/updater.js IS the updater's
              # runtime engine (shipped inside the ui package), so engine
              # changes must run the updater legs (#174 skip audit).
              - 'tools/publish/remote-ui/**'
              # Snapshot-shaping tooling: the legs build their snapshot with
              # upload.mjs, whose generator flag passthrough decides the baked
              # LOCAL identity. The 2026-09-25 regression shipped green legs on
              # all browsers while every snapshot installer pointed at the
              # GitHub release URLs — none of these paths were watched.
              - 'tools/publish/upload.mjs'
              - 'tools/publish/syncGeneratedFiles.mjs'
              - 'tools/publish/generateUpdaterConfig.mjs'
              - 'tools/publish/publishMode.mjs'
              - 'installer/Makefile'
              - 'config/installer.conf'
              - 'test/e2e/updater/**'
              - 'test/e2e/shared/**'
              - '.github/workflows/e2e.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            core:
              - 'core/**'
              - 'test/e2e/core/**'
              - '.github/workflows/e2e.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # ── Dev snapshot (built ONCE per run, shared across all updater legs) ────
  # The package zips + hashes.json are OS-independent, so one ubuntu build
  # serves every updater leg. A LOCAL-mode build bakes the BUILDER's dist dir
  # into utils.zip's generated config (part of the hashed file set), so on a
  # different OS the test repoints the updater at its own copy via
  # extensions.firefox-scripts.override.<KEY> prefs (localConfigOverrides in
  # test/e2e/shared/helpers.mjs) — never by rewriting the config, which would
  # flip the package hash and break the staleness check.
  snapshot:
    name: build dev snapshot
    needs: changes
    # A single-browser dispatch (the watchdog's new-release leg, or ci:download)
    # must build the snapshot too: browser-matrix needs it, and a needs-chain
    # skip is transitive — without this, the escape dispatch ran nothing
    # (#143 proof run 34033626251).
    if:
      needs.changes.outputs.updater == 'true' || needs.changes.outputs.core == 'true' ||
      github.event_name == 'workflow_dispatch' && inputs.browser != 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: $/.github/actions/setup-repo

      # 'linux' implies the aarch64 twin in upload.mjs — install its
      # cross-compiler first (also validates the cross-compile on every PR).
      - name: Harden apt sources
        uses: ./.github/actions/harden-apt

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build snapshot
        run: pnpm snapshot:dev

      - name: Upload dev snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-snapshot
          path: dist/
          if-no-files-found: error

  # ── Installer E2E ──────────────────────────────────────────────────────────
  installer:
    name: 'installer E2E · ${{ matrix.os }}'
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ${{ matrix.os }}
    # 20 min > the runner's own 10-min watchdog (installer-e2e.mjs), so on a
    # wedge the script's orphan sweep + [watchdog] log always wins the race
    # and CI never shows a bare VM kill. Slowest green run: 143 s. The
    # headroom over 15 min is for the browser install this leg shares with the
    # other legs (`setup-browser`): the 12-min download budget plus the install
    # and the installer suite have to fit inside one cap, or a slow vendor
    # mirror would be reported as a cancelled job instead of a download error.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: $/.github/actions/setup-repo

      # 'linux' implies the aarch64 twin in upload.mjs (Linux runners only).
      - name: Harden apt sources
        if: runner.os == 'Linux'
        uses: ./.github/actions/harden-apt

      - name: Install aarch64 cross toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build snapshot
        run: pnpm snapshot:dev

      # The UI layer launches a real Firefox (even headless it needs a display
      # server on Linux runners), so install xvfb and run under it — same as
      # the updater job below.
      - name: Install Linux test prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        uses: ./.github/actions/linux-test-prereqs

      # The UI layer and the restart-scope leg (#180) launch a real Firefox.
      # Hosted runners cannot be relied on to ship one, so install Firefox
      # Release PORTABLY (runner temp — user-writable, unregistered) like the
      # portable-firefox and updater jobs do; downloads.mjs exports
      # FIREFOX_BINARY through $GITHUB_ENV.
      - name: Install Firefox Release (portable)
        uses: ./.github/actions/setup-browser
        with:
          browser: firefox

      - name: Run installer E2E (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        # -a picks a free display number, avoiding collisions with the
        # updater E2E job that also runs under xvfb-run on the same runner.
        run: xvfb-run -a node test/e2e/installer/installer-e2e.mjs --ui --headless

      - name: Run installer E2E (macOS/Windows)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: node test/e2e/installer/installer-e2e.mjs --ui --headless

  # ── Helper E2E (Linux elevated-copy core) ──────────────────────────────────
  helper:
    name: 'helper E2E · ${{ matrix.os }}'
    needs: changes
    if: needs.changes.outputs.updater == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: $/.github/actions/setup-repo

      - name: Build helper binary
        run: |
          mkdir -p dist/installer
          make -C installer helper_linux MODE=dev

      - name: Test elevated copy (sudo)
        run: |
          echo "hello" > /tmp/test_src.txt
          sudo ./dist/installer/helper_linux /tmp/test_src.txt /etc/fxs-e2e-test.txt
          diff /tmp/test_src.txt /etc/fxs-e2e-test.txt
          sudo rm /etc/fxs-e2e-test.txt
          rm /tmp/test_src.txt

  # ── Updater E2E ────────────────────────────────────────────────────────────
  # Every leg is required: the updater must work on Firefox stable, Firefox
  # Developer Edition AND Nightly across the supported OS matrix (#35 — Dev
  # Edition and Nightly are first-party Mozilla channels, hard-gated like
  # stable, unlike the forks; Nightly per the #4 plan section).
  updater:
    name: 'updater E2E · ${{ matrix.browser }} · ${{ matrix.os }}'
    needs: [changes, snapshot]
    if: needs.changes.outputs.updater == 'true'
    runs-on: ${{ matrix.os }}
    # Browser legs download their Firefox fresh each run (no cache): worst
    # observed 293 s warm, ~8 min with a cold download — 20 min is ~2.5x.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: firefox, os: ubuntu-24.04}
          - {browser: firefox, os: macos-latest}
          - {browser: firefox, os: windows-latest}
          - {browser: firefox-dev, os: ubuntu-24.04}
          - {browser: firefox-dev, os: macos-latest}
          - {browser: firefox-dev, os: windows-latest}
          - {browser: nightly, os: ubuntu-24.04}
          - {browser: nightly, os: macos-latest}
          - {browser: nightly, os: windows-latest}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: $/.github/actions/setup-repo

      # Linux needs xvfb for the BiDi run; the browser itself always comes
      # from downloads.mjs's official recipe (apt's Snap wrapper breaks BiDi).
      - name: Install Linux test prerequisites
        if: matrix.os == 'ubuntu-24.04'
        uses: ./.github/actions/linux-test-prereqs

      - name: Install ${{ matrix.browser }}
        uses: ./.github/actions/setup-browser
        with:
          browser: ${{ matrix.browser }}

      # Restores dist/dev-<branch>-<sha>/ built once by the `snapshot` job.
      # On non-ubuntu legs the baked LOCAL_DIST_PATH differs from this
      # runner's, so the test sets the override prefs (localConfigOverrides)
      # to point the updater at this copy.
      - name: Download dev snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      # The test builds its own fresh temp profile from the dev snapshot, so no
      # profile-seed step is needed. It reads FIREFOX_BINARY (set by the install
      # step above) and auto-discovers the snapshot dir.
      - name: Run updater E2E (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a node test/e2e/updater/updater-e2e.mjs

      - name: Run updater E2E (macOS)
        if: matrix.os == 'macos-latest'
        run: node test/e2e/updater/updater-e2e.mjs

      - name: Run updater E2E (Windows)
        if: matrix.os == 'windows-latest'
        run: node test/e2e/updater/updater-e2e.mjs

      # Ground truth of what THIS leg validated. Mozilla's "latest" redirects
      # embed no version in the URL, so the tested release can only be read
      # from the installed binary (downloads.mjs --installed-version, which
      # falls back to application.ini). Matrix job outputs do not aggregate on
      # GitHub (limitation #17245), so the version travels as a tiny per-leg
      # artifact that the record-validation job downloads. These steps run
      # only after the E2E above passed (failure stops the step chain).
      - name: Capture installed ${{ matrix.browser }} version
        id: instver
        shell: bash
        run: |
          VER="$(node test/e2e/shared/downloads.mjs ${{ matrix.browser }} --installed-version)"
          echo "Tested ${{ matrix.browser }} $VER on ${{ matrix.os }}"
          printf '{"browser":"%s","os":"%s","version":"%s"}\n' \
            "${{ matrix.browser }}" "${{ matrix.os }}" "$VER" \
            > "e2e-version-${{ matrix.browser }}-${{ matrix.os }}.json"

      - name: Upload ${{ matrix.browser }} version artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-version-${{ matrix.browser }}-${{ matrix.os }}
          path: e2e-version-${{ matrix.browser }}-${{ matrix.os }}.json
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.browser }}-${{ matrix.os }}
          path: |
            dist/updater-e2e-*.png
            dist/installer-e2e-*.png
          if-no-files-found: ignore

  # ── Portable Firefox Release E2E (#56) ────────────────────────────────────
  # Firefox Release is installed into a runner-temp custom directory rather
  # than Program Files, /Applications, or a package-managed location. The
  # existing installer and updater tests then exercise detection, GreD
  # discovery, installation, and updater-tab behavior against that binary.
  portable-firefox:
    name: 'portable Firefox E2E · ${{ matrix.os }}'
    needs: [changes, snapshot]
    if: needs.changes.outputs.updater == 'true'
    runs-on: ${{ matrix.os }}
    # Slowest leg in the suite (373 s windows-latest warm; the extracted-dir
    # cache keeps the portable install cheap — cold adds ~2 min).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      # $/ prefix: the runner materializes the local action from the triggering
      # commit — a ./ local action would need a checkout step first.
      - uses: $/.github/actions/setup-repo

      # The key hashes the version-embedded final CDN URL, not the stable
      # `?product=firefox-latest` redirect: that redirect never changes, so a
      # key derived from it would pin yesterday's extracted browser in the
      # portable-dir cache forever — the skip check would happily keep testing
      # a stale Firefox. One redirect hop lands on the CDN URL that embeds the
      # version (155.0.1 today); downloads.mjs resolves it with a HEAD and
      # hashes THAT (see downloads.mjs resolveDownloadUrl). The key guards both
      # caches (installer + extracted dir); downloadTo's HEAD-size check
      # additionally self-heals the installer cache.
      - name: Install Firefox Release portably
        id: portable-install
        uses: ./.github/actions/setup-browser
        with:
          browser: firefox
          cache-key-prefix: firefox-portable
          portable: 'true'

      - name: Assert portable layout (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          # -e so the assertions below actually fail the step: without it a
          # false `test -f` just falls through to the next echo and the step
          # reports success.
          set -euo pipefail
          # Name the missing variable instead of dying as `unbound variable`
          # (or comparing two empty strings) — both are published by the
          # setup-browser install step above.
          if [ -z "${FIREFOX_BINARY:-}" ]; then
            echo "::error title=FIREFOX_BINARY unset::the setup-browser install step did not publish FIREFOX_BINARY"
            exit 1
          fi
          if [ -z "${PORTABLE_BROWSER_DIR:-}" ]; then
            echo "::error title=PORTABLE_BROWSER_DIR unset::setup-browser must run with portable: 'true' for this leg"
            exit 1
          fi
          case "$FIREFOX_BINARY" in
            "$PORTABLE_BROWSER_DIR"/*) ;;
            *) echo "::error::Firefox binary is not inside portable directory: $FIREFOX_BINARY"; exit 1 ;;
          esac
          test -f "$FIREFOX_BINARY"
          echo "Portable Firefox: $FIREFOX_BINARY"

      - name: Assert portable layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Name the missing variable instead of throwing PowerShell's
          # "You cannot call a method on a null-valued expression" — both are
          # published by the setup-browser install step above.
          if (-not $env:FIREFOX_BINARY) {
            throw "FIREFOX_BINARY is unset -- the setup-browser install step did not publish it"
          }
          if (-not $env:PORTABLE_BROWSER_DIR) {
            throw "PORTABLE_BROWSER_DIR is unset -- setup-browser must run with portable: 'true' for this leg"
          }
          if (-not $env:FIREFOX_BINARY.StartsWith($env:PORTABLE_BROWSER_DIR, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Firefox binary is not inside portable directory: $env:FIREFOX_BINARY"
          }
          if (-not (Test-Path -LiteralPath $env:FIREFOX_BINARY -PathType Leaf)) {
            throw "Firefox binary not found: $env:FIREFOX_BINARY"
          }
          Write-Host "Portable Firefox: $env:FIREFOX_BINARY"

      - name: Download dev snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      # The shared snapshot is built on Ubuntu and therefore contains only the
      # Linux installer. Build the native installer locally for this runner;
      # package zips remain sourced from the shared snapshot.
      - name: Build native installer
        uses: ./.github/actions/build-installer

      - name: Install Linux test prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        uses: ./.github/actions/linux-test-prereqs

      - name: Run portable installer E2E (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: xvfb-run -a node test/e2e/installer/installer-e2e.mjs --ui --headless

      - name: Run portable installer E2E (macOS/Windows)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: node test/e2e/installer/installer-e2e.mjs --ui --headless

      - name: Run portable updater E2E (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: xvfb-run -a node test/e2e/updater/updater-e2e.mjs

      - name: Run portable updater E2E (macOS/Windows)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: node test/e2e/updater/updater-e2e.mjs

      # Same failure diagnostics as the installer/updater jobs: the E2E
      # harness leaves failure screenshots in dist/ for artifact upload.
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-portable-firefox-${{ matrix.os }}
          path: |
            dist/installer-e2e-*.png
            dist/updater-e2e-*.png
          if-no-files-found: ignore

  # ── Core lifecycle E2E (legacy chrome registration) ───────────────────────
  # Regression test for the SHIPPED core/chrome/utils/BootstrapLoader.js and
  # userChrome.js (discussion #101; PR #245's chrome.manifest sweep): the
  # manifest-lifecycle harness registers a legacy bootstrap extension's chrome
  # across three real Firefox sessions (fresh profile / plain restart /
  # cache-clear restart) and asserts chrome stays live plus the startup sweep
  # leaves no manifest litter. The one harness that exercises the legacy
  # chrome lifecycle end-to-end — it MUST run on every core/** change (the
  # updater legs cover the updater UI, not this surface).
  # Portable Firefox for a writable GreD (the harness seeds config.js there).
  core-lifecycle:
    name: 'core lifecycle E2E · ${{ matrix.os }}'
    needs: [changes, snapshot]
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: $/.github/actions/setup-repo

      # Writable GreD via the portable install (cache machinery identical to
      # the portable-firefox job — see the key-design comment there).
      - name: Install Firefox Release portably
        uses: ./.github/actions/setup-browser
        with:
          browser: firefox
          cache-key-prefix: firefox-portable
          portable: 'true'

      - name: Download dev snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      - name: Install Linux test prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        uses: ./.github/actions/linux-test-prereqs

      - name: Run core lifecycle E2E (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: xvfb-run -a pnpm test:e2e:legacy -- --headless

      - name: Run core lifecycle E2E (macOS/Windows)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: pnpm test:e2e:legacy -- --headless

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-core-lifecycle-${{ matrix.os }}
          path: |
            dist/manifest-lifecycle-*.png
            dist/updater-e2e-*.png
          if-no-files-found: ignore

  # ── Snap Firefox E2E (#55) ─────────────────────────────────────────────────
  # Ubuntu's default Firefox packaging is a snap; every other leg installs the
  # official tarball, so the snap build was never exercised and its GreD was
  # unverified (future-work §2.1 marked it "open"). This leg installs Firefox
  # through the snap store, verifies the actual GreD path, and runs the
  # installer (HTTP+UI detection) and updater E2E against the snap binary.
  #
  # NOT on the PR path (since 2026-09-22): the snap store is the flakiest
  # dependency in the matrix (CDN 502s, snapd self-refresh deadlocks — a
  # red leg never blocked anything, it just burned ~4 min of every
  # updater-PR run), so the leg runs on the WEEKLY schedule + manual
  # dispatch only. The store revision is probed via the store API and the
  # .snap + assertion are downloaded with plain retryable HTTPS (snap
  # download), cached by revision, and installed OFFLINE (snap ack + snap
  # install) — a store outage falls back to the cached revision, and the
  # step exports SNAP_STORE_UNAVAILABLE=1 so the watchdog can open a
  # deduped issue when even the fallback fails (see the final step).
  #
  # Still ADVISORY in the gate; skipped quietly when snapd is unavailable.
  snap-firefox:
    name: 'snap Firefox E2E · ubuntu-24.04'
    needs: [changes, snapshot]
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.updater == 'true' && github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      store_unavailable: ${{ steps.store.outputs.store_unavailable }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: $/.github/actions/setup-repo

      # Availability gate: skip the whole leg when the runner has no working
      # snapd (advisory — availability varies by runner image, #55).
      - name: Check snapd availability
        id: snapd
        run: |
          if command -v snap >/dev/null 2>&1 && sudo snap list >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "snapd is available"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::snapd unavailable on this runner — snap E2E leg skipped (#55)"
          fi

      - name: Install Linux test prerequisites
        if: steps.snapd.outputs.available == 'true'
        uses: ./.github/actions/linux-test-prereqs

      # Probe the store's current stable revision + cache the .snap/assert
      # pair by revision (plain HTTPS via `snap download` — retryable and
      # cacheable, unlike `snap install`, whose revision negotiation is not).
      # Same key-invalidation pattern as setup-browser's URL-hash keys: a new
      # store revision changes the key, so the cache can never pin a stale
      # Firefox. On any store failure the cached pair is the fallback; when
      # even that is missing the step fails AND exports
      # SNAP_STORE_UNAVAILABLE=1 for the watchdog-issue step at the end.
      - name: Resolve store revision
        id: rev
        if: steps.snapd.outputs.available == 'true'
        run: |
          set -euo pipefail
          REV=$(curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
            -H 'Snap-Device-Series: 16' \
            'https://api.snapcraft.io/v2/snaps/info/firefox' \
            | node --input-type=module -e "
              let d=''; for await (const c of process.stdin) d += c;
              const j = JSON.parse(d);
              const e = (j['channel-map'] || []).find(c => c.channel.track === 'latest' && c.channel.risk === 'stable');
              if (!e) process.exit(1);
              console.log(e.revision);
            ") || true
          if [ -z "${REV:-}" ]; then
            echo '::warning::snap store API unreachable — will try cache-only fallback'
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "revision=$REV" >> "$GITHUB_OUTPUT"
            echo "store revision: $REV"
          fi

      - name: Cache snap download
        if: steps.snapd.outputs.available == 'true' && steps.rev.outputs.available == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/snap-pkg
          key: snap-firefox-${{ steps.rev.outputs.revision }}

      - name: Download snap (revision-pinned, retryable)
        id: dl
        if: steps.snapd.outputs.available == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/snap-pkg
          cd ~/snap-pkg
          # Already cached for this revision? Skip the store entirely.
          if ls firefox_*.snap >/dev/null 2>&1; then
            echo "cache hit: using cached .snap + assertion"
            echo "from-cache=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.rev.outputs.available }}" != 'true' ]; then
            echo "::error::no cached snap and the store API is unreachable — no fallback (SNAP_STORE_UNAVAILABLE)"
            echo "SNAP_STORE_UNAVAILABLE=1" >> "$GITHUB_ENV"
            exit 1
          fi
          # Two attempts, hard 8-min wall each: a hang must die before the
          # 20-min job timeout so the diagnostic steps still run. cd + CWD
          # output instead of `--directory` — that flag does not exist on the
          # runner's snapd (first dispatch run: `unknown flag 'directory'`).
          # --revision alone pins the download; the snap CLI rejects
          # `--channel` alongside `--revision` ("cannot specify both channel
          # and revision"), so the channel is never passed here (regression
          # from #290, every leg red since Sep 22).
          for i in 1 2; do
            if timeout 480 snap download firefox --revision="${{ steps.rev.outputs.revision }}"; then
              echo "from-cache=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::snap download attempt $i failed — retrying in 20s"
            sleep 20
          done
          echo "::error::snap download failed after retry — trying cache fallback"
          if ls firefox_*.snap >/dev/null 2>&1; then
            echo "::warning::store down — proceeding with an OLDER cached revision"
            echo "from-cache=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "SNAP_STORE_UNAVAILABLE=1" >> "$GITHUB_ENV"
          exit 1

      # Offline install from the pinned pair — no store negotiation, no snapd
      # self-refresh race. `snap ack` + `snap install` elevate themselves via
      # sudo (passwordless on hosted runners); ack before install is required
      # for unasserted local files (--dangerous accepts unasserted, ack keeps
      # the provenance assertions in the verified path).
      #
      # This path bypasses the `downloads.mjs firefox-snap` recipe (the only
      # other place a snap Firefox is installed), so it must publish
      # FIREFOX_BINARY itself — the steps below (Verify snap GreD, both E2E
      # runs) read it, and without the export the cache-hit path died with
      # `FIREFOX_BINARY: unbound variable` (every run after #311 until fixed).
      - name: Install Firefox (snap, offline from cache)
        if: steps.snapd.outputs.available == 'true' && steps.dl.outputs.from-cache == 'true'
        run: |
          set -euo pipefail
          sudo snap ack ~/snap-pkg/firefox_*.assert
          sudo snap install ~/snap-pkg/firefox_*.snap --classic
          test -x /snap/bin/firefox || { echo '::error::snap install ran, but /snap/bin/firefox not found'; exit 1; }
          echo "FIREFOX_BINARY=/snap/bin/firefox" >> "$GITHUB_ENV"

      # Only reached when the store path succeeded above (from-cache=false);
      # kept for provenance symmetry with downloads.mjs's own recipe. A store
      # failure here cannot happen — the download step already handled it —
      # but a failure still marks the leg failed without the fallback signal
      # (the cache fallback IS the fallback).
      - name: Install Firefox (snap)
        if: steps.snapd.outputs.available == 'true' && steps.dl.outputs.from-cache != 'true'
        run: node test/e2e/shared/downloads.mjs firefox-snap

      # THE point of this leg (#55): discover the snap GreD at runtime —
      # findGreDir() maps a /snap/ binary to /etc/firefox — and verify it
      # against the actual snap mount before any test relies on it. Findings
      # land in the step summary so the future-work §2.1 row can be closed.
      - name: Verify snap GreD
        if: steps.snapd.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Fail with the fix, not `FIREFOX_BINARY: unbound variable`: the only
          # publisher is an install step above, and BOTH snap install paths —
          # the store download and the offline-from-cache pair — have to export
          # it. The cache-hit path skipped the export and took this leg down on
          # every run after #311 (#313).
          if [ -z "${FIREFOX_BINARY:-}" ]; then
            echo "::error title=FIREFOX_BINARY unset::no snap install step published FIREFOX_BINARY — check the store AND the offline-from-cache install paths"
            exit 1
          fi
          BIN="$FIREFOX_BINARY"
          test -x "$BIN" || { echo "::error::snap Firefox binary missing: $BIN"; exit 1; }
          # One single-quoted-script string: a second quoted fragment would
          # become argv[1] and shift $BIN to argv[2] (that bug made GRED
          # empty in the first CI run).
          GRED=$(node --input-type=module -e "import {findGreDir} from './test/e2e/shared/browsers.mjs'; console.log(findGreDir(process.argv[1]))" "$BIN")
          echo "binary: $BIN"
          echo "findGreDir(): $GRED"
          echo "### Snap Firefox GreD verification (#55)" >> "$GITHUB_STEP_SUMMARY"
          echo "| probe | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| FIREFOX_BINARY | \`$BIN\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| findGreDir() | \`$GRED\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -d /etc/firefox ]; then
            echo "/etc/firefox exists → documented GreD target confirmed for this snap build"
            echo "| /etc/firefox exists | yes |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "/etc/firefox does NOT exist — findGreDir() must be reconciled with the actual path"
            echo "| /etc/firefox exists | no |" >> "$GITHUB_STEP_SUMMARY"
            echo "| snap mount | \`$(snap run --shell firefox -c 'echo $SNAP' 2>/dev/null || echo n/a)\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Hard assertion: whatever findGreDir() returns must exist as a
          # directory after the snap install (user-writable config dir is
          # created on first run or by the package itself).
          test -d "$GRED" || {
            echo "::error::findGreDir() returned a non-existent dir for the snap binary: $GRED"
            exit 1
          }

      # Snapshot gate for the two E2E steps below: when the download step
      # already failed (e.g. no cache and the store down), the E2E steps would
      # only hit the misleading "No snapshot found" — skip them instead; the
      # leg is failed anyway and the store-watch job files the issue.
      - name: Download dev snapshot
        id: snapshot
        if: steps.snapd.outputs.available == 'true' && !failure() && !cancelled()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      # Same as the portable-firefox job: the shared snapshot is built on
      # Ubuntu but artifact upload/download drops the execute bit, so build
      # the native installer locally (package zips stay from the snapshot).
      # findInstaller() prefers INSTALLER_BIN: the E2E looks in the
      # SNAPSHOT dir (dist/dev-HEAD-<sha>/), where the artifact copy
      # lacks the execute bit — point it at the freshly built binary.
      - name: Build native installer
        if: steps.snapd.outputs.available == 'true'
        uses: ./.github/actions/build-installer

      # Snap-environment preparation for the two E2E runs:
      #
      # 1. WRITABLE GreD — the tabmixplus-docs installation guide says snap
      #    users copy config.js into /etc/firefox and "may have to create the
      #    sub folders defaults/pref" themselves; on the runner /etc/firefox
      #    is root-owned, so chown it to the runner user (the production
      #    analog is the updater's admin-copy path, which stays on the manual
      #    checklist — here we make the SEED writable so the harness can
      #    exercise the flow it is supposed to test).
      # 2. SNAP-ACCESSIBLE TMP — a strictly-confined snap Firefox cannot read
      #    /tmp (karma-firefox-launcher#183), so the E2E's os.tmpdir() test
      #    profiles are invisible to it ("Could not find profile folder").
      #    Point TMPDIR into $HOME, which the snap's home interface allows.
      - name: Prepare snap environment
        if: steps.snapd.outputs.available == 'true'
        run: |
          sudo chown -R "$(id -un):$(id -gn)" /etc/firefox
          mkdir -p /etc/firefox/defaults/pref
          mkdir -p "$HOME/tmp"
          echo "TMPDIR=$HOME/tmp" >> "$GITHUB_ENV"

      # Detection against the snap build (HTTP + UI layers + the test-surface
      # layer from #129): the installer must discover /snap/bin/firefox and
      # report it like any other browser.  The UI layer runs HEADED under xvfb
      # (real-user mode) with --ui-fallback-open: the installer's cross-process
      # relaunch cannot hand its URL into a BiDi-driven SNAP instance under CI
      # (headless and headed, unconfined and snap-wrapped relaunch all fail on
      # this leg; the tarball legs hand off fine), so when no tab surfaces the
      # harness opens the installer's own UI URL in-process and the UI
      # assertions (cards, badges, screenshot) still run.  The relaunch caveat
      # is documented in docs/future-work.md §2.
      - name: Run installer E2E (snap Firefox)
        if: steps.snapd.outputs.available == 'true' && steps.snapshot.conclusion == 'success'
        run: xvfb-run -a node test/e2e/installer/installer-e2e.mjs --ui --ui-fallback-open

      # Updater flow against the snap build: tab opens, config seeds into the
      # (now runner-owned) /etc/firefox GreD, status renders. Elevation into
      # a root-owned GreD stays on the manual release checklist (future-work
      # §2) — the admin-copy path cannot be automated on hosted runners.
      # Runs even when the installer step above failed: each half of the leg
      # reports independently, so one failure never hides the other's result.
      - name: Run updater E2E (snap Firefox)
        if: always() && steps.snapshot.conclusion == 'success'
        run: xvfb-run -a node test/e2e/updater/updater-e2e.mjs

      # Store-down signal for the follow-up job: the E2E workflow's token is
      # deliberately contents: read (PR build code runs here — no issue-write
      # in the same job, per the workflow-level permission note), so the
      # deduped issue is filed by the snap-store-watch job below, which is the
      # ONLY job granted issues: write. Exported as a JOB OUTPUT (not a step
      # output) so the needs-chain can read it after the job ends.
      - name: Export store status
        if: always()
        id: store
        run: echo "store_unavailable=${SNAP_STORE_UNAVAILABLE:-0}" >> "$GITHUB_OUTPUT"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-snap-firefox
          path: |
            dist/installer-e2e-*.png
            dist/updater-e2e-*.png
          if-no-files-found: ignore

  # ── Snap store-down issue (deduped) ─────────────────────────────────────
  # When the snap leg could not install Firefox from the store AND had no
  # cached fallback (SNAP_STORE_UNAVAILABLE=1), file the same deduped issue
  # the url-watchdog uses for rot — title-stable so recurring outages comment
  # on one thread instead of spamming new issues, auto-closable by the next
  # green snap leg. Scoped to this one job: issues: write never touches a
  # job that executes PR build code (the E2E workflow's own policy).
  snap-store-watch:
    name: snap store watchdog
    needs: [snap-firefox, e2e-gate]
    if: >-
      always() && github.event_name != 'pull_request' && needs.snap-firefox.result == 'failure' &&
      needs.snap-firefox.outputs.store_unavailable == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: File deduped store-outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='[url-watchdog] snap store unreachable — snap Firefox E2E has no fallback'
          BODY=$(cat <<'EOF'
          The snap Firefox E2E leg could not reach the snap store AND found no
          cached revision to fall back on (SNAP_STORE_UNAVAILABLE=1).

          Watchdog run: ${RUN_URL}

          The leg installs from the store API revision probe + plain-HTTPS
          `snap download`, cached per revision; this failure means the store
          API/CDN was unreachable through retries AND the Actions cache held
          no prior revision. Verify store health; the next green scheduled
          run auto-closes this issue.
          EOF
          )
          MATCH="$(gh issue list --label url-watchdog --state open --search "$TITLE" --json number --jq '.[0].number // ""')"
          if [ -n "$MATCH" ]; then
            gh issue comment "$MATCH" --body "Recurring outage — ${RUN_URL}"
          else
            gh issue create --label url-watchdog --title "$TITLE" --body "$BODY"
          fi

  # ── Browser matrix (advisory, Windows) ────────────────────────────────────
  # Each browser resolves its installer through test/e2e/shared/browserResolver.mjs:
  # ── Fork-browser matrix (advisory) ─────────────────────────────────────
  # LibreWolf (Codeberg bsys6 → packages API; librewolf.dev → dl.librewolf.net
  # → bsys6 asset → ci-downloads → cached installer), Floorp and Zen (GitHub
  # stable latest asset URLs). Waterfox is NOT here anymore — it graduated to
  # the required `updater-waterfox` job above (ADR 0025); a `browser=waterfox`
  # dispatch still collapses the matrix to it for the BROWSER_PIN_VERSION
  # escape (ADR 0021/0023). Firefox Dev Edition is NOT here — it is
  # first-party Mozilla and runs as a required leg of the `updater` job above.
  browser-matrix:
    name: 'updater E2E · ${{ matrix.browser }} · windows-latest'
    # Same updater E2E test as the `updater` job, so it is gated on the same
    # changed-paths filter (skips on docs-only / tooling-only PRs). The legs
    # stay ADVISORY in the gate: their failures warn instead of blocking.
    needs: [changes, snapshot]
    if:
      (github.event_name != 'workflow_dispatch' && (needs.changes.outputs.updater == 'true' ||
      needs.changes.outputs.core == 'true')) || github.event_name == 'workflow_dispatch' &&
      inputs.browser != 'firefox-esr'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Manual escape: a `browser` input collapses the matrix to that one leg
      # (dynamic JSON matrix — the canonical fromJSON pattern). Empty input
      # (or any non-dispatch event, where `inputs` is empty) = the full matrix.
      # waterfox stays selectable here for pinned single-browser escapes even
      # though its steady-state leg is the required `updater-waterfox` job.
      matrix:
        browser:
          ${{ fromJSON(inputs.browser != '' && inputs.browser != 'all' && inputs.browser !=
          'firefox-esr' && format('["{0}"]', inputs.browser) || '["librewolf", "floorp", "zen"]') }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Manual escape: pin the resolver to the requested version (empty input
      # = resolve the newest). Pinned version + ci-downloads release works even
      # with the vendor API fully down.
      BROWSER_PIN_VERSION: ${{ inputs.version }}

    steps:
      - uses: $/.github/actions/setup-repo

      # The ~100 MB installers dominate the job; the composite caches them
      # keyed on the resolved download URL (embeds the version for
      # LibreWolf/Waterfox). Floorp/Zen's stable latest URLs keep a constant
      # key — downloadTo() re-fetches when the remote size changes, and
      # save-always re-caches. downloads.mjs resolves the real binary from
      # install dirs (never a PATH shim or app-execution alias, whose parent
      # dir is not the browser's GreD), exporting FIREFOX_BINARY.
      - name: Install ${{ matrix.browser }}
        uses: ./.github/actions/setup-browser
        with:
          browser: ${{ matrix.browser }}
          cache-key-prefix: browser-dl
          # The manual escape (ADR 0021) beats the validated-record pin.
          pin-version: ${{ inputs.version }}

      # Restores dist/dev-<branch>-<sha>/ built by the `snapshot` job. The
      # ubuntu snapshot's baked LOCAL_DIST_PATH differs from this Windows
      # runner's, so the test sets the override prefs (localConfigOverrides)
      # to point the updater at this copy.
      - name: Download dev snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      - name: Run updater E2E
        run: node test/e2e/updater/updater-e2e.mjs

      # ADR 0034: the release THIS leg validated is what the fork pin will serve
      # to later runs. Only fork browsers upload — the hard-gate versions come
      # from the `updater` matrix legs, and a same-named artifact from here would
      # collide with theirs in the recorder's flattened version dir.
      #
      # `matrix.os || 'windows-latest'`: this job is Windows-only and its matrix
      # carries NO os key, so a bare `matrix.os` expands to the empty string —
      # which produced `e2e-version-zen-.json` with `"os":""` on PR #304 (the
      # recorder rejects an unknown OS, and the recording job only runs on a
      # dispatch, so the artifact bug would have surfaced only then). The `||`
      # keeps the label correct if an os dimension is ever added here.
      - name: Capture installed ${{ matrix.browser }} version
        if: ${{ contains(fromJSON('["librewolf","floorp","zen"]'), matrix.browser) }}
        shell: bash
        run: |
          VER="$(node test/e2e/shared/downloads.mjs ${{ matrix.browser }} --installed-version)"
          OS="${{ matrix.os || 'windows-latest' }}"
          echo "Validated ${{ matrix.browser }} $VER on $OS"
          printf '{"browser":"%s","os":"%s","version":"%s"}\n' \
            "${{ matrix.browser }}" "$OS" "$VER" > "e2e-version-${{ matrix.browser }}-$OS.json"

      - name: Upload ${{ matrix.browser }} version artifact
        if: ${{ contains(fromJSON('["librewolf","floorp","zen"]'), matrix.browser) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-version-${{ matrix.browser }}-${{ matrix.os || 'windows-latest' }}
          path: e2e-version-${{ matrix.browser }}-${{ matrix.os || 'windows-latest' }}.json
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.browser }}
          path: dist/updater-e2e-*.png
          if-no-files-found: ignore

  # ── Fork-portable E2E (advisory, Windows; #38 pre-1.0) ────────────────
  # The fork legs above install into Program Files (registered layout). This
  # leg drives the SAME official NSIS installers into a custom directory
  # (NSIS /D=) — the layout a substantial share of users run and the shape
  # the installer/updater must detect without a registered install dir. The
  # recipes (portable: true + portableExe) and the /D= mechanism landed in
  # #194; this job wires the legs. Zen + Floorp + Waterfox: the three forks
  # whose installers are VERIFIED to honor /D= into a fresh directory
  # (LibreWolf's setup does not declare that capability, so its leg stays
  # registered-only). ADVISORY like browser-matrix: a fork packaging change
  # (e.g. a broken /D=) must not block a Firefox-only merge. Same
  # URL-keyed download cache as browser-matrix, PLUS the extracted-dir cache
  # (the portable Firefox pattern) so a warm run skips the silent install.
  fork-portable:
    name: 'fork portable E2E · ${{ matrix.browser }} · windows-latest'
    needs: [changes, snapshot]
    # A single-browser librewolf escape is excluded (no portable recipe → the
    # leg would install registered and the layout assert would fail — observed
    # live 2026-09-19, run 35452996723). A full dispatch runs the default
    # matrix (the revalidation escape covers everything); firefox-esr is not a
    # fork and never lands here.
    if:
      (github.event_name != 'workflow_dispatch' && (needs.changes.outputs.updater == 'true' ||
      needs.changes.outputs.core == 'true')) || github.event_name == 'workflow_dispatch' &&
      inputs.browser != 'librewolf' && inputs.browser != 'firefox-esr'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Manual escape: a `browser` dispatch collapses the matrix to that one
      # leg (empty/non-dispatch input = the full matrix).
      matrix:
        browser:
          ${{ fromJSON(inputs.browser != '' && inputs.browser != 'all' && inputs.browser !=
          'firefox-esr' && format('["{0}"]', inputs.browser) || '["zen", "floorp", "waterfox"]') }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      BROWSER_PIN_VERSION: ${{ inputs.version }}

    steps:
      - uses: $/.github/actions/setup-repo

      # Zen/Floorp resolve to STABLE latest/download URLs, so the URL hash
      # alone cannot invalidate a cache when the browser releases. downloads.mjs
      # resolves the version-bearing CDN/asset URL with a HEAD hop and hashes
      # THAT for the key (the portable Firefox leg's pattern); downloadTo's
      # HEAD-size check additionally self-heals the installer cache when a
      # stable URL still serves a new file size.
      - name: Install ${{ matrix.browser }} portably
        uses: ./.github/actions/setup-browser
        with:
          browser: ${{ matrix.browser }}
          cache-key-prefix: browser-dl
          portable: 'true'
          # Same pin as browser-matrix: the portable leg must install the release
          # its registered twin validated, never a newer one (ADR 0034).
          pin-version: ${{ inputs.version }}

      - name: Assert portable layout
        shell: pwsh
        run: |
          # Name the missing variable instead of throwing PowerShell's
          # "You cannot call a method on a null-valued expression" — both are
          # published by the setup-browser install step above.
          if (-not $env:FIREFOX_BINARY) {
            throw "FIREFOX_BINARY is unset -- the setup-browser install step did not publish ${{ matrix.browser }}"
          }
          if (-not $env:PORTABLE_BROWSER_DIR) {
            throw "PORTABLE_BROWSER_DIR is unset -- setup-browser must run with portable: 'true' for this leg"
          }
          if (-not $env:FIREFOX_BINARY.StartsWith($env:PORTABLE_BROWSER_DIR, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "${{ matrix.browser }} binary is not inside portable directory: $env:FIREFOX_BINARY"
          }
          if (-not (Test-Path -LiteralPath $env:FIREFOX_BINARY -PathType Leaf)) {
            throw "${{ matrix.browser }} binary not found: $env:FIREFOX_BINARY"
          }
          Write-Host "Portable ${{ matrix.browser }}: $env:FIREFOX_BINARY"

      - name: Download dev snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      - name: Run updater E2E
        run: node test/e2e/updater/updater-e2e.mjs

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-fork-portable-${{ matrix.browser }}
          path: dist/updater-e2e-*.png
          if-no-files-found: ignore

  # ── Firefox ESR legs (advisory, dynamic matrix) ───────────────────────
  # The watchdog baseline's ESR state (watchdog-report.mjs updateEsrState)
  # tracks the two newest ESR majors; the matrix here is built from the same
  # baseline so a rotation (a new FIREFOX_ESR_NEXT major) adds/retires legs
  # with zero repo edits. One job computes the matrix from the restored
  # baseline; esr-portable runs the updater E2E against each watched ESR
  # portable install on Windows (the platform the installer/updater admin-
  # copies on). Advisory: an ESR failure warns but never blocks a merge or a
  # publish — the ESR surface is back-compat coverage, not a gate.
  esr-matrix:
    name: esr matrix
    needs: [changes]
    # ESR is a Firefox back-compat surface — it has nothing to do with fork
    # releases. Path-based triggers (core/** or updater-impacting changes) run
    # on PRs and main pushes only; on workflow_dispatch the ONLY way in is the
    # explicit `browser=firefox-esr` escape (the weekly watchdog's ESR-drift
    # validation). Fork escapes and full revalidation dispatches never run the
    # ESR legs — a same-day fork-release dispatch storm must not re-run them.
    if:
      github.event_name != 'workflow_dispatch' && (needs.changes.outputs.updater == 'true' ||
      needs.changes.outputs.core == 'true') || github.event_name == 'workflow_dispatch' &&
      inputs.browser == 'firefox-esr'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.mtx.outputs.matrix }}
    steps:
      # tools/ci/esrMatrix.mjs runs from the repo — checkout first (the
      # cache/restore below does not materialize it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Read-only against the baseline cache — save stays with the watchdog
      # workflow (this restore is best-effort; cache miss → generic serving-ESR
      # leg via buildEsrMatrix's fallback).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog
          key: url-watchdog-baseline-not-used
          restore-keys: url-watchdog-baseline-
      - name: Build the ESR leg matrix
        id: mtx
        shell: bash
        # tools/ci/esrMatrix.mjs prints the matrix JSON on stdout (fallback
        # included). No inline node here: a multi-line -e string is split per
        # line in bash and each line becomes a shell command (exit 127).
        run: |
          MATRIX=$(node tools/ci/esrMatrix.mjs .watchdog/baseline.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "ESR legs: $MATRIX"

  esr-portable:
    name: 'updater E2E · ${{ matrix.browser }} · windows-latest (advisory)'
    needs: [changes, snapshot, esr-matrix]
    if: needs.esr-matrix.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.esr-matrix.outputs.matrix) }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: $/.github/actions/setup-repo

      # Same URL-keyed installer cache as the fork legs — the releases-index
      # setup URL embeds the version, so each ESR point release gets its own
      # cache entry. Portable (/D=) so the ESR install never collides with the
      # registered stable Firefox the other legs may have installed.
      - name: Install ${{ matrix.browser }} portably
        uses: ./.github/actions/setup-browser
        with:
          browser: ${{ matrix.browser }}
          cache-key-prefix: esr-portable
          portable: 'true'

      - name: Assert portable layout
        shell: pwsh
        run: |
          # Name the missing variable instead of throwing PowerShell's
          # "You cannot call a method on a null-valued expression" — both are
          # published by the setup-browser install step above.
          if (-not $env:FIREFOX_BINARY) {
            throw "FIREFOX_BINARY is unset -- the setup-browser install step did not publish ${{ matrix.browser }}"
          }
          if (-not $env:PORTABLE_BROWSER_DIR) {
            throw "PORTABLE_BROWSER_DIR is unset -- setup-browser must run with portable: 'true' for this leg"
          }
          if (-not $env:FIREFOX_BINARY.StartsWith($env:PORTABLE_BROWSER_DIR, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "${{ matrix.browser }} binary is not inside portable directory: $env:FIREFOX_BINARY"
          }
          if (-not (Test-Path -LiteralPath $env:FIREFOX_BINARY -PathType Leaf)) {
            throw "${{ matrix.browser }} binary not found: $env:FIREFOX_BINARY"
          }
          Write-Host "Portable ${{ matrix.browser }}: $env:FIREFOX_BINARY"

      - name: Download dev snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      - name: Run updater E2E
        run: node test/e2e/updater/updater-e2e.mjs

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-esr-portable-${{ matrix.browser }}
          path: dist/updater-e2e-*.png
          if-no-files-found: ignore

  # ── Waterfox hard gate (ADR 0025, amends ADR 0021) ────────────────────────────
  # Waterfox is ≈40% of the user base; after a 4-green-run soak (ADR 0021's
  # flip criterion) its updater E2E leg is REQUIRED, not advisory. Windows-only
  # because its download recipe is the Windows NSIS installer. Kept OUT of the
  # `updater` matrix so one browser's recipe cannot fail the firefox/firefox-dev
  # /nightly legs wholesale — this job carries its own retry/mirror chain.
  # Version artifact: uploaded like the `updater` legs so record-validation
  # records the exact waterfox build the leg validated (single-OS set).
  updater-waterfox:
    name: 'updater E2E · waterfox · windows-latest'
    needs: [changes, snapshot]
    # `browser=waterfox` dispatches run this required leg (ADR 0025 break-glass
    # pin); other partial dispatches don't apply it — the gate's applicability
    # entry and the check-gate-coverage contract carry the same predicate.
    # (core/** pushes/PRs reach it through changes.updater, which the changes
    # job sets from the core filter — see the changes-job outputs.)
    if:
      needs.changes.outputs.updater == 'true' || needs.changes.outputs.core == 'true' ||
      github.event_name == 'workflow_dispatch' && inputs.browser == 'waterfox'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Manual escape (ADR 0021/0023): pin the resolver to the requested
      # version when a dispatch pins one (empty on push/PR events).
      BROWSER_PIN_VERSION: ${{ inputs.version }}

    steps:
      - uses: $/.github/actions/setup-repo

      # Same URL-keyed installer cache as the fork legs — the CDN setup URL
      # embeds the version, so each release gets its own cache entry.
      - name: Install waterfox
        uses: ./.github/actions/setup-browser
        with:
          browser: waterfox

      - name: Download dev snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-snapshot
          path: dist/

      - name: Run updater E2E
        run: node test/e2e/updater/updater-e2e.mjs

      # Same artifact contract as the `updater` matrix legs: the exact tested
      # version travels to record-validation as a file (GitHub limitation
      # #17245). Consumed with a waterfox-specific single-OS expected set.
      - name: Capture installed waterfox version
        id: instver
        shell: bash
        run: |
          VER="$(node test/e2e/shared/downloads.mjs waterfox --installed-version)"
          echo "Tested waterfox $VER on windows-latest"
          printf '{"browser":"%s","os":"%s","version":"%s"}\n' \
            "waterfox" "windows-latest" "$VER" \
            > "e2e-version-waterfox-windows-latest.json"

      - name: Upload waterfox version artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-version-waterfox-windows-latest
          path: e2e-version-waterfox-windows-latest.json
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-waterfox
          path: dist/updater-e2e-*.png
          if-no-files-found: ignore

  # ── E2E gate ─────────────────────────────────────────────────────────────
  # Single branch-protection check. Every upstream job is a hard gate, so a
  # green aggregate check cannot hide a failed, cancelled, or skipped matrix
  # leg. The verify logic (required / advisory / skip-guard) lives in the
  # shared .github/actions/verify-gate engine, kept consistent with ci-gate.
  # `pnpm check:gates` enforces this needs list.
  e2e-gate:
    name: E2E gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs:
      [
        changes,
        snapshot,
        installer,
        helper,
        updater,
        updater-waterfox,
        portable-firefox,
        snap-firefox,
        core-lifecycle,
        browser-matrix,
        fork-portable,
        esr-matrix,
        esr-portable,
      ]
    steps:
      # Local action — a fresh runner needs the repo checked out first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/verify-gate
        with:
          changes-result: ${{ needs.changes.result }}
          # e2e-gate always verifies: per-job applicability decides which jobs
          # must pass vs. must be skipped (no single branchKey anymore).
          # Keep applicability/results entries bare — the gate-coverage checker
          # parses 12-space `name:` pairs only (no comment lines inside).
          branch: true
          branch-label: E2E-relevant changes
          # snap-firefox is additionally availability-gated at runtime (snapd
          # probe): the gate treats it as advisory, so a runner without snapd
          # cannot block a merge.
          applicability: |-
            snapshot:${{ (needs.changes.outputs.updater == 'true' || needs.changes.outputs.core == 'true') || (github.event_name == 'workflow_dispatch' && inputs.browser != 'all') }}
            installer:${{ needs.changes.outputs.installer == 'true' }}
            helper:${{ needs.changes.outputs.updater == 'true' }}
            updater:${{ needs.changes.outputs.updater == 'true' }}
            updater-waterfox:${{ needs.changes.outputs.updater == 'true' || needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch' && inputs.browser == 'waterfox' }}
            portable-firefox:${{ needs.changes.outputs.updater == 'true' }}
            snap-firefox:${{ (needs.changes.outputs.updater == 'true' && github.event_name == 'push') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
            core-lifecycle:${{ needs.changes.outputs.core == 'true' }}
            browser-matrix:${{ (needs.changes.outputs.updater == 'true' || needs.changes.outputs.core == 'true') || (github.event_name == 'workflow_dispatch' && inputs.browser != 'firefox-esr') }}
            fork-portable:${{ (needs.changes.outputs.updater == 'true' || needs.changes.outputs.core == 'true') || (github.event_name == 'workflow_dispatch' && inputs.browser != 'librewolf' && inputs.browser != 'firefox-esr') }}
            esr-matrix:${{ (github.event_name != 'workflow_dispatch' && (needs.changes.outputs.updater == 'true' || needs.changes.outputs.core == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.browser == 'firefox-esr') }}
            esr-portable:${{ needs.esr-matrix.result == 'success' }}
          # Literal block: prettier leaves `|` content alone, so each pair
          # stays on its own line and no ${{ }} expression is ever split.
          # verify.sh splits the value on whitespace, newlines included.
          results: |-
            snapshot:${{ needs.snapshot.result }}
            installer:${{ needs.installer.result }}
            helper:${{ needs.helper.result }}
            updater:${{ needs.updater.result }}
            updater-waterfox:${{ needs.updater-waterfox.result }}
            portable-firefox:${{ needs.portable-firefox.result }}
            snap-firefox:${{ needs.snap-firefox.result }}
            core-lifecycle:${{ needs.core-lifecycle.result }}
            browser-matrix:${{ needs.browser-matrix.result }}
            fork-portable:${{ needs.fork-portable.result }}
            esr-matrix:${{ needs.esr-matrix.result }}
            esr-portable:${{ needs.esr-portable.result }}
          required:
            snapshot installer helper updater updater-waterfox portable-firefox core-lifecycle
          advisory: snap-firefox browser-matrix fork-portable esr-matrix esr-portable
          skip-guard:
            snapshot installer helper updater updater-waterfox portable-firefox snap-firefox
            core-lifecycle browser-matrix fork-portable esr-matrix esr-portable

  # ── Record validated browser versions (#4) ────────────────────────────────
  # After the updater matrix legs (firefox/firefox-dev/nightly × 3 OSes) ran
  # and passed, record the EXACT versions those legs installed into
  # .watchdog-validated/ (Actions cache, rotating key — same pattern as the
  # watchdog baseline; a dedicated dir so the publish pre-flight's baseline
  # restore can never clobber it). The prod publish pre-flight requires the
  # current releases to be covered by this record, so a watchdog baseline
  # refresh alone cannot satisfy the drift gate: the shipped browser versions
  # must have a passing E2E run.
  record-validation:
    name: record validated browser versions
    # `updater` is needed directly because this job must prove the legs
    # ACTUALLY RAN: needs.updater.result aggregates the whole matrix, so a
    # 'success' means all nine updater legs (firefox/firefox-dev/nightly × 3
    # OSes) ran and passed. Nightly's artifacts are intentionally ignored by
    # the recorder (VALIDATED_BROWSERS — Nightly changes daily and must never
    # gate the publish pre-flight). A
    # core-only main push (updater legs path-skipped → result 'skipped') no
    # longer records — without a test run, re-resolving live versions would
    # claim untested releases as E2E-validated (#134 review finding 5).
    needs: [e2e-gate, updater]
    # `always() &&` intentionally overrides the needs-graph skip rules. The
    # gate itself runs via if: always() and can succeed while a path-filtered
    # sibling (installer legs) was skipped; since ~2026-08-29 a needs entry
    # in state 'skipped' then makes THIS job skip too, even though its own
    # condition holds (byte-identical workflow ran the job on 08-29 12:40 and
    # 17:01, skipped ever since — GitHub-side evaluation change). With
    # always() the result comparisons below still decide the outcome, so the
    # job records only runs whose updater legs really validated.
    #
    # Partial-dispatch guard (ADR 0021): a single-browser manual escape
    # (workflow_dispatch with `browser` set) must NOT record — it validated
    # only one fork, and overwriting the record could let the publish gate
    # ship a firefox/firefox-dev release that no full run ever tested.
    if: >-
      always() && needs.e2e-gate.result == 'success' && needs.updater.result == 'success' &&
      github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' &&
      inputs.browser != '' && inputs.browser != 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job touches issues (meta-issue comment). Job-level permissions
    # REPLACE the workflow-level block, so contents: read (checkout, scripts)
    # must be listed here as well — not just issues: write.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The exact tested versions arrive as per-leg artifacts from the updater
      # matrix legs (matrix outputs do not aggregate — GitHub limitation
      # #17245, hence files). Each leg uploads e2e-version-<browser>-<os>.json;
      # flatten them into .e2e-versions/ for the recorder.
      - name: Download tested versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-version-*
          path: .e2e-versions
          merge-multiple: true
      - name: Record validated browser versions
        env:
          VALIDATED_DIR: .watchdog-validated
          E2E_VERSIONS_DIR: .e2e-versions
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/record-validated-versions.mjs
      - name: Save validated-versions record
        # Explicit cache/save with if: always() — the record must persist even
        # when a later leg fails (the save-always input is deprecated upstream
        # and slated for removal).
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog-validated
          key: browser-validated-${{ github.run_id }}
        if: always()

  # ── Fork validation record (ADR 0034) ─────────────────────────────────────
  # Records the release the fork legs actually validated — the version the fork
  # E2E legs then install instead of resolving `latest`.
  #
  # Deliberately SEPARATE from record-validation, in job, cache and file: that
  # job writes validated.json, which the prod publish pre-flight compares against
  # the current releases, and it refuses to record on a partial dispatch for
  # exactly that reason. A single-browser fork dispatch (the watchdog's
  # per-release validation) is the run that must advance a fork pin, so it gets
  # its own record — a fork run can never reach the publish gate's semantics.
  #
  # Dispatch-only: a green PR leg installs the PINNED release, so recording from
  # a PR would let the pin chase whatever a PR happened to resolve. Only a green
  # browser-matrix run on a dispatch (the watchdog's planDispatches output, issue
  # #143) advances it.
  #
  # `success || failure`, not `success`: a fork leg's version artifact exists
  # only when that leg's E2E passed, so recording from a partially-failed matrix
  # still advances exactly the forks that were validated. Requiring a fully
  # green matrix would let one flaky fork (they are advisory, fail-fast: false)
  # freeze the other two pins. `skipped`/`cancelled` are excluded — a
  # firefox-esr dispatch never runs this matrix, and a cancelled run validated
  # nothing.
  record-fork-validation:
    name: record validated fork versions
    needs: [e2e-gate, browser-matrix]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && (needs.browser-matrix.result ==
      'success' || needs.browser-matrix.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Best-effort: carries the other forks (and their validation dates)
      # forward while this run refreshes the one it dispatched.
      - name: Restore the fork record
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog-fork-validated
          key: browser-fork-validated-${{ github.run_id }}
          restore-keys: browser-fork-validated-
      - name: Download tested fork versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-version-*
          path: .e2e-fork-versions
          merge-multiple: true
      - name: Record validated fork versions
        env:
          VALIDATED_DIR: .watchdog-fork-validated
          E2E_VERSIONS_DIR: .e2e-fork-versions
        run: node tools/ci/record-validated-versions.mjs --forks-only
      - name: Save the fork record
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog-fork-validated
          key: browser-fork-validated-${{ github.run_id }}
        if: always()

  # ── Manual-escape cleanup (ADR 0021) ─────────────────────────────────────
  # A single-browser dispatch may consume an installer from the temporary
  # `ci-downloads` release (created on demand by pnpm ci:download). This job
  # deletes the consumed asset afterwards — and the release + tag once empty —
  # so the steady state is "the ci-downloads release does not exist". Runs
  # only for partial manual escapes, never on push/PR. A FAILED leg still
  # cleans up (!cancelled); a CANCELLED one leaves the installer for the
  # immediate retry.
  cleanup-ci-downloads:
    name: cleanup ci-downloads release
    needs: [e2e-gate]
    # Runs after the gate (post-gate job): a failed advisory leg still cleans
    # up (the gate reports advisory failures without blocking, so a green or
    # warning gate both proceed here); a CANCELLED run skips this job outright
    # (GitHub cancels pending needs-jobs), leaving the installer for the retry.
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.browser != '' && inputs.browser
      != 'all' &&      needs.e2e-gate.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # delete the release asset + release + tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete consumed ci-downloads asset (and release when empty)
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER: ${{ inputs.browser }}
          VERSION: ${{ inputs.version }}
        run: node tools/ci/cleanupCiDownloads.mjs
