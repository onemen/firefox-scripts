name: Cache cleanup

# Prunes old GitHub Actions caches (tools/ci/prune-caches.mjs) so stale keys
# from Firefox-version bumps, pnpm/setup's per-run store keys and lockfile
# changes don't accumulate forever. GitHub only auto-evicts (LRU) past the
# 10 GB total, so old keys otherwise burn quota on every run that tries to
# restore them.
#
# The SCHEDULED prune lives in the url-watchdog's nightly tick (22:00 UTC —
# the repo's only cron): a fresh pnpm/browser save lands every night, so
# a weekly window would let the repo sit at the 10 GB cap for days and invite
# GitHub's LRU eviction to eat the watchdog's own state caches. This
# workflow remains for manual runs:
#
#   gh workflow run cache-cleanup.yml --field keep=3 --field dry_run=true
#
# Only the default branch (main) schedules the nightly; this file is
# dispatch-only by design.

on:
  workflow_dispatch:
    inputs:
      keep:
        description: 'versions to keep per cache-key stem'
        type: number
        default: 3
      dry_run:
        description: 'list without deleting'
        type: boolean
        default: false

permissions:
  actions: write # delete caches
  contents: read

jobs:
  prune:
    runs-on: ubuntu-24.04
    # Prune of a non-critical janitorial task: 15 min is ~10x the observed run
    # time; the workflow shares no concurrency group, but an untimed
    # actions:write job is still an unbounded failure surface.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prune caches
        env:
          GITHUB_TOKEN_VAR: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--keep=${{ inputs.keep || 3 }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node tools/ci/prune-caches.mjs $ARGS
