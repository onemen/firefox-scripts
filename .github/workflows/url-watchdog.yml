# URL watchdog — catch rot in the E2E browser download map.
#
# CI installs Firefox, Firefox Dev Edition, LibreWolf, Floorp and Zen from
# third-party hosts (Mozilla, librewolf.dev, GitHub releases). Those URLs can
# rot silently: a 404, an HTML error page where a binary used to be, or a
# package-registry API that changed shape. This workflow re-resolves each
# browser's latest version and verifies its download endpoint with a 1 KB
# ranged GET — nothing is downloaded in full except one SHA-256 pass per new
# release. One `[url-watchdog] status` meta issue keeps a per-browser status
# table + version history (the SHA-256 ledger); rot and size changes open
# deduped error issues that auto-close once a later run checks green again.
#
# Two modes (see tools/check-browser-downloads.mjs):
# - Nightly (schedule/dispatch): version baseline + history in the Actions cache
#   (.watchdog/baseline.json), status meta issue, deduped error issues.
# - Report-only (dispatch with report-only=true, or the post-E2E refresh
#   below): no vendor calls — rebuilds the status table from the baseline +
#   the LIVE Actions-cache inventory, so the Fallback column stays truthful
#   after any cache save. The watchdog is the repo's only vendor-facing job:
#   map-touching PRs prove the map through the E2E legs that install the URL
#   (a rotten URL reds the leg for real), so no separate PR probe exists.

name: URL watchdog

on:
  schedule:
    # 22:00 UTC daily — this is the repo's only nightly cron now. It drives the
    # nightly revalidation: the `Dispatch nightly revalidation` step below
    # dispatches a full e2e.yml run plus core-smoke-nightly.yml after the
    # baseline save. GitHub's cron fires late (measured +2h56…+7h02 over six
    # weeks), so the effective start is ~01:00-05:00 UTC; that is still a daily
    # cadence, and nothing else depends on the wall-clock time.
    - cron: '0 22 * * *'
  # Post-E2E refresh (#499): the scheduled render runs BEFORE the dispatched
  # E2E revalidation lands its records. Re-render report-only once E2E
  # finishes so the table shows the just-finished validation, not last
  # night's. Only the E2E workflow's completion matters here.
  workflow_run:
    workflows: ['E2E']
    types: [completed]
  workflow_dispatch:
    inputs:
      report-only:
        description:
          'Refresh the status table only — no vendor API calls, no downloads, no baseline write'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: url-watchdog
  cancel-in-progress: false

jobs:
  # ── Nightly: baseline + issues ────────────────────────────────────────────
  check:
    name: check browser download URLs
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    # The full-download path is progress-aware: a slow vendor
    # download runs to its 20 min transfer budget (plus retries) instead of
    # being killed early. The job timeout must fit that budget, not the other
    # way around.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Baseline = last-seen version + size (+ one-time sha256 per release).
      # Nightly access keeps the 7-day cache TTL rolling; a missed run just
      # re-baselines. Keys ROTATE per run (run_id): the cache service skips a
      # save whose exact key already exists, so a fixed key would silently
      # never persist the updated baseline after the first run. Restore falls
      # back to the newest entry of the previous runs via the prefix.
      - name: Restore baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog
          key: url-watchdog-baseline-${{ github.run_id }}
          restore-keys: url-watchdog-baseline-

      # Validated-versions record (written by E2E's record-validation job):
      # lets the status table show which release a successful E2E run actually
      # tested (the publish pre-flight already restores the same cache under
      # VALIDATED_DIR).
      - name: Restore validated-versions record
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog-validated
          key: browser-validated-${{ github.run_id }}
          restore-keys: browser-validated-

      # Sidecar fork record (written by E2E's record-fork-validation job):
      # feeds the forks' E2E-validated cells and Download times (#499).
      - name: Restore fork-validation record
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog-fork-validated
          key: browser-fork-validated-${{ github.run_id }}
          restore-keys: browser-fork-validated-

      - name: Check browser downloads
        run: |
          ARGS=""
          if [ "${{ inputs.report-only }}" = "true" ]; then ARGS="--report-only"; fi
          node tools/check-browser-downloads.mjs $ARGS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_DIR: .watchdog-validated
          FORKS_DIR: .watchdog-fork-validated

      # Explicit save (not save-always): the script rewrites baseline.json
      # every run even when the restore step hit; the fresh key persists a
      # version bump for the next run (immutable old entries just expire after
      # 7 days). if: always() keeps that behavior; the save-always input is
      # deprecated upstream and slated for removal.
      - name: Save baseline
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog
          key: url-watchdog-baseline-${{ github.run_id }}
        # Report-only never rewrote the baseline file — saving would mint a
        # redundant ~KB cache entry per manual refresh.
        if: always() && inputs.report-only != true

      # ── Nightly revalidation dispatch (plan replay) ───────────────────────
      # AFTER the baseline save, deliberately: the dispatched E2E run reads
      # this baseline (esr-matrix consumes it, and the record-validation
      # pre-flight compares against it), so dispatching before the save would
      # validate the previous baseline — a race that costs the run its purpose.
      #
      # This step only replays the plan the check step wrote to
      # .watchdog/dispatch-plan.json. The guards live there: a report-only or
      # --dry-run run writes no plan (so this is a no-op), the nightly full
      # e2e dispatch is deduped against the finding-driven ones (two full runs
      # share a concurrency group and would cancel each other), a failed
      # dispatch files the deduped issue the old in-process path used, and
      # core-smoke-nightly.yml is dispatched once — its own build-ID marker
      # skips nights without a new build. No `if: always()`: a failed check
      # step wrote no plan, so there is nothing to replay.
      # Report-only refreshes (manual or the post-E2E job below) never
      # dispatch: they wrote no plan, so there is nothing to replay — and a
      # refresh must not fan out into another E2E run.
      - name: Dispatch nightly revalidation
        if: inputs.report-only != true && github.event_name != 'workflow_run'
        run: node tools/check-browser-downloads.mjs --dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_DIR: .watchdog-validated

      # Nightly cache prune (replaces the former weekly cache-cleanup cron):
      # the nightly tick is the repo's only nightly cron, the check job
      # already carries actions: write, and a daily cadence matters because a
      # fresh pnpm/browser save-mint lands every night — a weekly window would
      # let the repo sit at the 10 GB cap for days, which invites
      # GitHub's LRU eviction to eat the watchdog's own state caches.
      # The prune script keeps keep-one groups (browser releases, pnpm store)
      # plus the operator count for everything else; keep-1 there is the same
      # policy tools/ci/prune-caches.mjs documents. The token must be passed
      # explicitly — the job's actions: write permission does not export an
      # env var, and the script reads only GITHUB_TOKEN_VAR/GH_TOKEN.
      # Skipped on the post-E2E refresh: it saved nothing, and the E2E run's
      # own post-gate prune already retired what that run superseded.
      # Also skipped on a manual report-only refresh: the table is rebuilt
      # from the live cache inventory first, so pruning after the render
      # would delete entries the just-written footer still reports.
      - name: Prune stale Actions caches
        if: github.event_name != 'workflow_run' && inputs.report-only != true
        env:
          GITHUB_TOKEN_VAR: ${{ github.token }}
        run: node tools/ci/prune-caches.mjs --keep=3

    # Job-level scoping (the E2E workflow's precedent): dispatching the browser
    # E2E when a new release is recorded needs actions: write; the issue
    # surface needs issues: write.
    permissions:
      contents: read
      issues: write
      actions: write

  # ── Post-E2E refresh: single post-validation render (#499) ───────────────
  # The scheduled render above runs BEFORE the dispatched E2E revalidation
  # lands its records, so its E2E column is structurally one night stale.
  # This job re-renders report-only (no vendor calls, no baseline write, no
  # dispatch) once the E2E run finishes — the table readers see already
  # includes the just-finished validation. The meta-issue PATCH is itself a
  # no-op when nothing changed, so quiet nights cost one short job, not churn.
  refresh-after-e2e:
    name: refresh status table after E2E
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Restore baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog
          key: url-watchdog-baseline-${{ github.run_id }}
          restore-keys: url-watchdog-baseline-

      - name: Restore validated-versions record
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog-validated
          key: browser-validated-${{ github.run_id }}
          restore-keys: browser-validated-

      - name: Restore fork-validation record
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog-fork-validated
          key: browser-fork-validated-${{ github.run_id }}
          restore-keys: browser-fork-validated-

      - name: Refresh status table (report-only)
        run: node tools/check-browser-downloads.mjs --report-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_DIR: .watchdog-validated
          FORKS_DIR: .watchdog-fork-validated
