# URL watchdog — catch rot in the E2E browser download map.
#
# CI installs Firefox, Firefox Dev Edition, LibreWolf, Floorp and Zen from
# third-party hosts (Mozilla, librewolf.dev, GitHub releases). Those URLs can
# rot silently: a 404, an HTML error page where a binary used to be, or a
# package-registry API that changed shape. This workflow re-resolves each
# browser's latest version and verifies its download endpoint with a 1 KB
# ranged GET — nothing is downloaded in full except one SHA-256 pass per new
# release. One `[url-watchdog] status` meta issue keeps a per-browser status
# table + version history (the SHA-256 ledger); rot and size changes open
# deduped error issues that auto-close once a later run checks green again.
#
# Two modes (see tools/check-browser-downloads.mjs):
# - Weekly (schedule/dispatch): version baseline + history in the Actions cache
#   (.watchdog/baseline.json), status meta issue, deduped error issues.
# - PR (pull_request touching the download map): stateless and always green —
#   findings surface as ::warning:: / ::notice:: annotations, so the check can
#   be required without ever blocking.

name: URL watchdog

on:
  pull_request:
    paths:
      - 'test/e2e/shared/downloads.mjs'
  # The PR check is stateless + always green, so it can safely run on the
  # merge queue too (a required check must report on merge_group).
  merge_group:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC — browsers release ~monthly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: url-watchdog
  cancel-in-progress: false

jobs:
  # ── Weekly: baseline + issues ─────────────────────────────────────────────
  check:
    name: check browser download URLs
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    # The full-download path is progress-aware (issue #143): a slow vendor
    # download runs to its 20 min transfer budget (plus retries) instead of
    # being killed early. The job timeout must fit that budget, not the other
    # way around.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Baseline = last-seen version + size (+ one-time sha256 per release).
      # Weekly access keeps the 7-day cache TTL rolling; a missed run just
      # re-baselines. Keys ROTATE per run (run_id): the cache service skips a
      # save whose exact key already exists, so a fixed key would silently
      # never persist the updated baseline after the first run. Restore falls
      # back to the newest entry of the previous runs via the prefix.
      - name: Restore baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog
          key: url-watchdog-baseline-${{ github.run_id }}
          restore-keys: url-watchdog-baseline-

      # Validated-versions record (written by E2E's record-validation job):
      # lets the status table show which firefox / firefox-dev release a
      # successful E2E run actually tested (the publish pre-flight already
      # restores the same cache under VALIDATED_DIR).
      - name: Restore validated-versions record
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog-validated
          key: browser-validated-${{ github.run_id }}
          restore-keys: browser-validated-

      - name: Check browser downloads
        run: node tools/check-browser-downloads.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_DIR: .watchdog-validated

      # save-always: the script rewrites baseline.json every run even when the
      # restore step hit; the fresh key persists a version bump for the next
      # run (immutable old entries just expire after 7 days).
      - name: Save baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog
          key: url-watchdog-baseline-${{ github.run_id }}
          save-always: true

  # ── PR: stateless rot check at review time ────────────────────────────────
  # Runs only when the download map itself changed. The script exits 0 and
  # prints ::warning:: annotations on rot, so this job never blocks — but it
  # can be added to branch protection as a required check.
  pr-check:
    name: browser download URLs (PR)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check browser downloads
        run: node tools/check-browser-downloads.mjs --pr
