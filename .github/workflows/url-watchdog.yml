# URL watchdog — catch rot in the E2E browser download map.
#
# CI installs Firefox, Firefox Dev Edition, LibreWolf, Floorp and Zen from
# third-party hosts (Mozilla, librewolf.dev, GitHub releases). Those URLs can
# rot silently: a 404, an HTML error page where a binary used to be, or a
# package-registry API that changed shape. This workflow re-resolves each
# browser's latest version and verifies its download endpoint with a 1 KB
# ranged GET — nothing is downloaded in full except one SHA-256 pass per new
# release. One `[url-watchdog] status` meta issue keeps a per-browser status
# table + version history (the SHA-256 ledger); rot and size changes open
# deduped error issues that auto-close once a later run checks green again.
#
# Three modes (see tools/check-browser-downloads.mjs):
# - Nightly (schedule/dispatch): version baseline + history on the durable
#   `watchdog-state` branch (.watchdog/baseline.json, ADR 0046), status meta
#   issue, deduped error issues.
# - Report-only (dispatch with report-only=true): no vendor calls — rebuilds
#   the status table from the baseline + the LIVE Actions-cache inventory, so
#   the Fallback column stays truthful after any cache save.
# - PR (pull_request touching the download map): stateless and always green —
#   findings surface as ::warning:: / ::notice:: annotations, so the check can
#   be required without ever blocking.

name: URL watchdog

on:
  pull_request:
    paths:
      - 'test/e2e/shared/downloads.mjs'
      # The stateless --pr pass exercises the watchdog tool itself, so tool
      # changes get a live (vendor-facing, always-green) smoke run too — same
      # set the browser-downloads filter ownership already defines. The
      # watchdog's pure reporting layer (watchdog-report.mjs) is part of the
      # tool surface.
      - 'tools/check-browser-downloads.mjs'
      - 'tools/ci/watchdog-report.mjs'
  # The PR check is stateless + always green, so it can safely run on the
  # merge queue too (a required check must report on merge_group).
  merge_group:
  schedule:
    # 22:00 UTC daily — this is the repo's only nightly cron now. It drives the
    # nightly revalidation: the `Dispatch nightly revalidation` step below
    # dispatches a full e2e.yml run plus core-smoke-nightly.yml after the
    # baseline save. GitHub's cron fires late (measured +2h56…+7h02 over six
    # weeks), so the effective start is ~01:00-05:00 UTC; that is still a daily
    # cadence, and nothing else depends on the wall-clock time.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      report-only:
        description:
          'Refresh the status table only — no vendor API calls, no downloads, no baseline write'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: url-watchdog
  cancel-in-progress: false

jobs:
  # ── Nightly: baseline + issues ────────────────────────────────────────────
  check:
    name: check browser download URLs
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    # The full-download path is progress-aware: a slow vendor
    # download runs to its 20 min transfer budget (plus retries) instead of
    # being killed early. The job timeout must fit that budget, not the other
    # way around.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Baseline = last-seen version + size (+ one-time sha256 per release), plus
      # the validated-versions record E2E's record-validation job writes — that
      # is what lets the status table show the release a successful E2E run
      # actually tested. BOTH live on the durable `watchdog-state` orphan branch
      # (ADR 0046), fetched into the two dirs the tools already read.
      #
      # Why not the Actions cache: GitHub evicted both entries on 2026-10-06 (the
      # repo crossed the 10 GB cap), and an evicted baseline is indistinguishable
      # from "no state at all" — every browser rendered `⏳ first run`, the
      # E2E-validated column said `none` while the meta issue's rolling comment
      # still carried the versions, and the publish pre-flight failed closed
      # (#462). A branch is durable, and one home means the stale copy cannot
      # masquerade as the fresh one. A missing branch/file is the first-run path,
      # not an error; a fetch that genuinely fails is hard (that distinction is
      # the whole bug).
      - name: Restore state from the watchdog-state branch
        env:
          BASELINE_DIR: .watchdog
          VALIDATED_DIR: .watchdog-validated
        run: node tools/ci/state-branch.mjs fetch

      - name: Check browser downloads
        run: |
          ARGS=""
          if [ "${{ inputs.report-only }}" = "true" ]; then ARGS="--report-only"; fi
          node tools/check-browser-downloads.mjs $ARGS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_DIR: .watchdog-validated

      # The ONLY writer of baseline.json (the E2E record job pushes the other
      # file). Unchanged state is not re-committed — the tool compares trees — so
      # a quiet night adds no commit to the branch. if: always() keeps the old
      # cache/save behavior: a check step that failed before rewriting the file
      # leaves the fetched copy in place, and pushing it is then a no-op (or a
      # clear "missing state file" error if the fetch itself failed, which is the
      # honest outcome for a run that has no baseline).
      - name: Publish the baseline to the watchdog-state branch
        env:
          BASELINE_DIR: .watchdog
        run: node tools/ci/state-branch.mjs push baseline.json
        # Report-only never rewrote the baseline file — pushing it would add a
        # redundant state read per manual refresh.
        if: always() && inputs.report-only != true

      # ── Nightly revalidation dispatch ───────────────────────────────────
      # AFTER the baseline save, deliberately: the dispatched E2E run reads
      # this baseline (esr-matrix consumes it, and the record-validation
      # pre-flight compares against it), so dispatching before the save would
      # validate the previous baseline — a race that costs the run its purpose.
      #
      # This step only replays the plan the check step wrote to
      # .watchdog/dispatch-plan.json. The guards live there: a report-only or
      # --dry-run run writes no plan (so this is a no-op), the nightly full
      # e2e dispatch is deduped against the finding-driven ones (two full runs
      # share a concurrency group and would cancel each other), a failed
      # dispatch files the deduped issue the old in-process path used, and
      # core-smoke-nightly.yml is dispatched once — its own build-ID marker
      # skips nights without a new build. No `if: always()`: a failed check
      # step wrote no plan, so there is nothing to replay.
      - name: Dispatch nightly revalidation
        run: node tools/check-browser-downloads.mjs --dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_DIR: .watchdog-validated

      # Nightly cache prune (replaces the former weekly cache-cleanup cron):
      # the nightly tick is the repo's only nightly cron, the check job
      # already carries actions: write, and a daily cadence matters because a
      # fresh pnpm/browser save-mint lands every night — a weekly window would
      # let the repo sit at the 10 GB cap for days, which invites
      # GitHub's LRU eviction to eat the watchdog's own state caches.
      # The prune script keeps keep-one groups (browser releases, pnpm store)
      # plus the operator count for everything else; keep-1 there is the same
      # policy tools/ci/prune-caches.mjs documents. The token must be passed
      # explicitly — the job's actions: write permission does not export an
      # env var, and the script reads only GITHUB_TOKEN_VAR/GH_TOKEN.
      - name: Prune stale Actions caches
        env:
          GITHUB_TOKEN_VAR: ${{ github.token }}
        run: node tools/ci/prune-caches.mjs --keep=3

    # Job-level scoping (the E2E workflow's precedent): dispatching the browser
    # E2E when a new release is recorded needs actions: write; the issue
    # surface needs issues: write; publishing the baseline to the state branch
    # (ADR 0046) needs contents: write. The PR job below needs none of them: it is
    # stateless by design (no baseline, no issues, no downloads).
    permissions:
      contents: write
      issues: write
      actions: write

  # ── PR: stateless rot check at review time ────────────────────────────────
  # Runs only when the download map itself changed. The script exits 0 and
  # prints ::warning:: annotations on rot, so this job never blocks — but it
  # can be added to branch protection as a required check.
  pr-check:
    name: browser download URLs (PR)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    # Same progress-aware vendor fetches as the scheduled `check` (30 min);
    # fewer URLs on a PR diff, so half the budget still gives ~5x headroom.
    timeout-minutes: 15
    # Stateless vendor checks + annotations only — no GitHub API calls, so no
    # write scopes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check browser downloads
        run: node tools/check-browser-downloads.mjs --pr
