name: Pages publish

# Publishes the release artifacts (package zips, installer/helper binaries,
# hash manifest) to the `latest` release + the `gh-pages` site — the same
# `node tools/publish/upload.mjs` run that was previously executed by hand.
#
# Trigger is manual only (workflow_dispatch): every run touches live
# artifacts consumed by installed browsers, so it must stay a deliberate,
# human-initiated act. Prod mode refuses to run from any branch but main
# (enforced inside upload.mjs); dev mode publishes a disposable
# dev-build-<branch>-<sha> branch + pre-release and never touches prod.
#
# Three stages (#353):
#   1. pre-publish — the prod drift gate (the shared drift-gate composite).
#   2. baseline, then a PARALLEL win/linux/mac matrix — each publish-<os> job
#      runs upload.mjs pass 1 (`--build-only`): hash-check against the shared
#      pre-run baseline, rebuild what changed, stage the binaries, upload the
#      staging tree as the publish-staged-<os> artifact. A staged pass touches
#      NO publish target, so the legs cannot interleave writers and may run
#      concurrently.
#   3. publish — ONE upload.mjs pass 2 (`--skip-build`) with all three
#      platforms in scope: verifies the staged set, re-runs the AV/VT gates
#      and performs the release + Pages publish. Single writer, so gh-pages
#      commits and release-asset uploads can never interleave — the property
#      the old serial job chain bought, bought here with the same two-pass
#      architecture build-and-upload.yml uses.
#
# The pre-run baseline still anchors change detection: the installer/helper
# hashes in the manifest are platform-independent, so a source change must
# make every platform diff against the manifest captured BEFORE the run —
# if a leg re-read the branch after a sibling pushed, only the first platform
# would ever rebuild after a source change.
#
# Pages serving stays "Deploy from branch: gh-pages" — this workflow pushes
# to that branch; it does not use the actions-pages deployment method.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'prod = latest release + gh-pages (main only) · dev = disposable dev-build-*'
        type: choice
        default: 'dev'
        options:
          - dev
          - prod
      force:
        description: 'Rebuild + re-upload even when hashes are unchanged (prod only)'
        type: boolean
        default: false
      include:
        description:
          'Roles to publish — packages|installer|helper|all, comma-separated (an explicitly empty
          value is rejected by upload.mjs; the default is a full publish)'
        type: string
        default: 'all'

permissions:
  contents: write # release assets + gh-pages pushes
  actions: write # release-gate cache-prune step deletes stale Actions caches
  issues: write # ADR 0021: the pre-flight's warn-and-continue path opens a deduped notification issue when a fork's version lookup fails

concurrency:
  group: pages-publish
  cancel-in-progress: false # a publish must never be killed mid-upload
  # ...so every job below sets timeout-minutes (matching build-and-upload.yml):
  # a hung step with no timeout would hold this NON-cancellable slot for
  # GitHub's 6-hour default, blocking every later publish behind it.

env:
  # upload.mjs reads its token from this fixed variable name.
  GITHUB_TOKEN_VAR: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Pre-publish gate: a browser released since the last weekly watchdog run
  # would ship unvalidated against the new version. The gate itself is the
  # shared `.github/actions/drift-gate` composite — ONE implementation, also
  # called by build-and-upload.yml and the drift-check.yml probe the
  # `pnpm publish:*` wrapper dispatches before this run (#347). This in-run
  # call stays the moment-of-truth enforcement: minutes pass between a green
  # probe and the real publish, so the verdict is re-checked here. Prod
  # publishes are BLOCKED on drift; dev publishes warn only.
  pre-publish:
    name: check browser version drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Drift gate
        id: gate
        uses: ./.github/actions/drift-gate
        with:
          mode: ${{ inputs.mode }}
          github-token: ${{ github.token }}
      - name: Act on the gate verdict
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
          MODE: ${{ inputs.mode }}
          DRIFT: ${{ steps.gate.outputs.drift }}
        run: |
          if [ "$VERDICT" = 'green' ]; then
            echo "no browser version drift since the last watchdog run"
            exit 0
          fi
          if [ -z "$VERDICT" ]; then
            echo "::error::the drift gate failed to run — see the Drift gate step above."
            exit 1
          fi
          if [ "$MODE" != 'prod' ]; then
            echo "::warning::browser version drift detected (dev mode — not blocking)"
            exit 0
          fi
          if [ "$VERDICT" = 'drift' ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::$line"
            done <<< "$DRIFT"
            echo "::error::new browser version(s) since the last watchdog run — run the URL watchdog workflow (refreshes the baseline + triggers browser-specific E2E), then re-dispatch publish."
          else
            echo "::error::no successful E2E workflow run for commit ${{ github.sha }} — let the E2E run on main finish (or re-run it), then re-dispatch the publish."
          fi
          exit 1
      # Release-gate cache hygiene (#47): the same prune the weekly workflow
      # runs, executed once more before any publish so a prod upload always
      # starts from a lean cache (stale firefox-dl-*/node-cache-* keys would
      # otherwise linger until Sunday).
      - name: Prune stale Actions caches
        run: node tools/ci/prune-caches.mjs --keep=3

  # Snapshot the hash manifest as it was BEFORE this run started. Every
  # publish leg diffs its sources against this same baseline, so a source
  # change makes all three platforms rebuild their native binaries.
  baseline:
    name: capture pre-run hash manifest
    needs: pre-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch current hashes.json from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          if gh api "repos/${{ github.repository }}/contents/hashes.json?ref=gh-pages" \
              --jq '.content' > /tmp/content.b64 2>/dev/null; then
            base64 -d /tmp/content.b64 > baseline/hashes.json
            echo "captured $(wc -c < baseline/hashes.json) bytes"
          else
            echo "no hashes.json on gh-pages yet — first publish starts fresh"
            echo '{}' > baseline/hashes.json
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-hashes
          path: baseline/hashes.json
          if-no-files-found: error

  # Build + stage matrix (pass 1, PARALLEL — #353). Each OS runs
  # `upload.mjs --build-only`: hash-check, rebuild changed, stage binaries,
  # upload the staging tree as an artifact, and STOP before the AV/VT gates
  # and any publishing. No leg touches any GitHub publish target; the merged
  # staging set is what the single-writer job publishes.
  #
  # The 'linux' platform builds the aarch64 twin too (upload.mjs expands it
  # automatically), so its leg needs the cross toolchain.
  #
  # Prod diff anchor: FIREFOX_SCRIPTS_STORED_HASHES_FILE points at the shared
  # pre-run baseline (never at what a sibling leg just pushed — pass 1 legs
  # push nothing, and the baseline predates the whole run).
  publish:
    name: publish — ${{ matrix.platform }} binaries
    needs: baseline
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-latest
            msys2: true
          - platform: linux
            os: ubuntu-24.04
            cross: true
          - platform: mac
            os: macos-latest
    # A packages-only publish stages no binaries — every leg would find nothing
    # to build, so the matrix skips and the single-writer job below runs pass 2
    # alone (zips are built inside pass 2; --skip-build requires no staged
    # binaries when nothing changed).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Node + pnpm here; on Windows dependencies install AFTER the MSYS2
      # toolchain step (make needs MSYS2, pnpm install does not care about
      # order).
      - uses: $/.github/actions/setup-repo
        with:
          install: 'false'
      # The exact toolchain the Windows binaries are built with lives in
      # config/msys2-toolchain.json (installed via pacman -U + verified): the
      # published PEs are unsigned with a per-hash AV verdict (issue #157), so
      # the bytes must be reproducible, not merely "a recent MSYS2".
      - name: Pinned MSYS2 toolchain (make + gcc)
        if: matrix.msys2
        uses: ./.github/actions/pinned-msys2
      - name: Harden apt sources
        if: matrix.cross
        uses: ./.github/actions/harden-apt
      - name: Install aarch64 cross toolchain (linux builds the twin)
        if: matrix.cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-hashes
          path: ${{ runner.temp }}/baseline/
      - run: pnpm install --frozen-lockfile
      # The shared upload invocation (.github/actions/publish-upload): env
      # markers, ARGS assembly and the baseline export live in ONE composite
      # action so the two publish workflows can never drift apart. Dispatch
      # inputs reach the shell through env vars, never interpolated into the
      # run script (script-injection surface).
      - name: Build and stage binaries (pass 1 — no publish target touched)
        uses: ./.github/actions/publish-upload
        with:
          mode: ${{ inputs.mode }}
          include: ${{ inputs.include }}
          platforms: ${{ matrix.platform }}
          force: ${{ inputs.force }}
          extra-args: '--build-only'
          baseline-file: ${{ runner.temp }}/baseline/hashes.json
          vt-api-key: ${{ secrets.VT_API_KEY }}
      # The staging tree (dist/.build) carries build-manifest.json — unused by
      # pass 2, which re-derives its staged set from disk. Each leg's manifest
      # overwrites the siblings' on artifact merge; only the staged bytes
      # matter here.
      - name: Upload staged binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-staged-${{ matrix.platform }}
          path: dist/.build/
          # dist/.build is a hidden directory — v4+ artifacts exclude hidden
          # paths by default, which silently uploads nothing.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Single writer (pass 2, #353): the ONLY job that writes any GitHub target.
  # Downloads all staging artifacts, then runs `upload.mjs --skip-build` with
  # all three platforms in scope: verifies the staged set (every binary a
  # changed hash would publish must be present — missing ones fail the run by
  # name), re-runs the AV/VT gates over the exact bytes, builds the packages
  # and performs the release + Pages publish. The packages-only case never
  # reaches this job (the matrix skips, and a skipped dependency skips its
  # dependents).
  publishing:
    name: publish staged set (single writer)
    needs: publish
    # Run after a successful staging matrix — OR alone when the matrix skipped
    # (packages-only dispatch: the zips are built inside pass 2). A failed or
    # cancelled matrix leg must NOT reach the single writer.
    if: ${{ always() && (inputs.include == 'packages' || needs.publish.result == 'success') }}
    # Prod publishes deploy through the `release` environment (protected-branch
    # policy: main only). Dev publishes are disposable and bypass the
    # environment so they can run from any branch.
    environment:
      name: ${{ inputs.mode == 'prod' && 'release' || 'dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: $/.github/actions/setup-repo
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-hashes
          path: ${{ runner.temp }}/baseline/
      - name: Download staged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: publish-staged-*
          merge-multiple: true
          path: dist/.build/
      # Pass 2: the staged bytes ARE the final artifacts — the gates and the
      # publish run on exactly what the matrix staged. The shared composite
      # action owns the invocation (see the matrix legs above).
      - name: Publish (pass 2 — gates + upload)
        uses: ./.github/actions/publish-upload
        with:
          mode: ${{ inputs.mode }}
          include: ${{ inputs.include }}
          platforms: 'win linux mac'
          force: ${{ inputs.force }}
          extra-args: '--skip-build'
          baseline-file: ${{ runner.temp }}/baseline/hashes.json
          vt-api-key: ${{ secrets.VT_API_KEY }}
