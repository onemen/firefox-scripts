name: Pages publish

# Publishes the release artifacts (package zips, installer/helper binaries,
# hash manifest) to the `latest` release + the `gh-pages` site — the same
# `node tools/publish/upload.mjs` run that was previously executed by hand.
#
# Trigger is manual only (workflow_dispatch): every run touches live
# artifacts consumed by installed browsers, so it must stay a deliberate,
# human-initiated act. Prod mode refuses to run from any branch but main
# (enforced inside upload.mjs); dev mode publishes a disposable
# dev-build-<branch>-<sha> branch + pre-release and never touches prod.
#
# The three publish jobs run SEQUENTIALLY so they can never interleave
# gh-pages commits or release-asset uploads. Change detection is anchored to
# a shared PRE-RUN baseline (`baseline` job captures the current hashes.json;
# every job diffs against it via FIREFOX_SCRIPTS_STORED_HASHES_FILE): the
# installer/helper/zips hashes in the manifest are platform-independent, so
# if each job re-read the branch after the previous job pushed, only the
# first platform would ever rebuild after a source change.
#
# Pages serving stays "Deploy from branch: gh-pages" — this workflow pushes
# to that branch; it does not use the actions-pages deployment method.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'prod = latest release + gh-pages (main only) · dev = disposable dev-build-*'
        type: choice
        default: 'dev'
        options:
          - dev
          - prod
      force:
        description: 'Rebuild + re-upload even when hashes are unchanged (prod only)'
        type: boolean
        default: false
      include:
        description:
          'Roles to publish — packages|installer|helper|all, comma-separated (an explicitly empty
          value is rejected by upload.mjs; the default is a full publish)'
        type: string
        default: 'all'

permissions:
  contents: write # release assets + gh-pages pushes
  actions: write # release-gate cache-prune step deletes stale Actions caches
  issues: write # ADR 0021: the pre-flight's warn-and-continue path opens a deduped notification issue when a fork's version lookup fails

concurrency:
  group: pages-publish
  cancel-in-progress: false # a publish must never be killed mid-upload
  # ...so every job below sets timeout-minutes (matching build-and-upload.yml):
  # a hung step with no timeout would hold this NON-cancellable slot for
  # GitHub's 6-hour default, blocking every later publish behind it.

env:
  # upload.mjs reads its token from this fixed variable name.
  GITHUB_TOKEN_VAR: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Pre-publish gate: a browser released since the last weekly watchdog run
  # would ship unvalidated against the new version. The gate itself is the
  # shared `.github/actions/drift-gate` composite — ONE implementation, also
  # called by build-and-upload.yml and the drift-check.yml probe the
  # `pnpm publish:*` wrapper dispatches before this run (#347). This in-run
  # call stays the moment-of-truth enforcement: minutes pass between a green
  # probe and the real publish, so the verdict is re-checked here. Prod
  # publishes are BLOCKED on drift; dev publishes warn only.
  pre-publish:
    name: check browser version drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Drift gate
        id: gate
        uses: ./.github/actions/drift-gate
        with:
          mode: ${{ inputs.mode }}
          github-token: ${{ github.token }}
      - name: Act on the gate verdict
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
          MODE: ${{ inputs.mode }}
          DRIFT: ${{ steps.gate.outputs.drift }}
        run: |
          if [ "$VERDICT" = 'green' ]; then
            echo "no browser version drift since the last watchdog run"
            exit 0
          fi
          if [ -z "$VERDICT" ]; then
            echo "::error::the drift gate failed to run — see the Drift gate step above."
            exit 1
          fi
          if [ "$MODE" != 'prod' ]; then
            echo "::warning::browser version drift detected (dev mode — not blocking)"
            exit 0
          fi
          if [ "$VERDICT" = 'drift' ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::$line"
            done <<< "$DRIFT"
            echo "::error::new browser version(s) since the last watchdog run — run the URL watchdog workflow (refreshes the baseline + triggers browser-specific E2E), then re-dispatch publish."
          else
            echo "::error::no successful E2E workflow run for commit ${{ github.sha }} — let the E2E run on main finish (or re-run it), then re-dispatch the publish."
          fi
          exit 1
      # Release-gate cache hygiene (#47): the same prune the weekly workflow
      # runs, executed once more before any publish so a prod upload always
      # starts from a lean cache (stale firefox-dl-*/node-cache-* keys would
      # otherwise linger until Sunday).
      - name: Prune stale Actions caches
        run: node tools/ci/prune-caches.mjs --keep=3

  # Snapshot the hash manifest as it was BEFORE this run started. Every
  # publish job diffs its sources against this same baseline, so a source
  # change makes all three platforms rebuild their native binaries.
  baseline:
    name: capture pre-run hash manifest
    needs: pre-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch current hashes.json from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          if gh api "repos/${{ github.repository }}/contents/hashes.json?ref=gh-pages" \
              --jq '.content' > /tmp/content.b64 2>/dev/null; then
            base64 -d /tmp/content.b64 > baseline/hashes.json
            echo "captured $(wc -c < baseline/hashes.json) bytes"
          else
            echo "no hashes.json on gh-pages yet — first publish starts fresh"
            echo '{}' > baseline/hashes.json
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-hashes
          path: baseline/hashes.json
          if-no-files-found: error

  publish-win:
    name: publish — windows binaries
    needs: baseline
    # Prod publishes deploy through the `release` environment (protected-branch
    # policy: main only). Dev publishes are disposable and bypass the
    # environment so they can run from any branch.
    environment:
      name: ${{ inputs.mode == 'prod' && 'release' || 'dev' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Node + pnpm here; dependencies install AFTER the MSYS2 toolchain
      # step (make needs MSYS2, pnpm install does not care about order).
      - uses: $/.github/actions/setup-repo
        with:
          install: 'false'
      # The exact toolchain the Windows binaries are built with lives in
      # config/msys2-toolchain.json (installed via pacman -U + verified): the
      # published PEs are unsigned with a per-hash AV verdict (issue #157), so
      # the bytes must be reproducible, not merely "a recent MSYS2".
      - name: Pinned MSYS2 toolchain (make + gcc)
        uses: ./.github/actions/pinned-msys2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-hashes
          path: ${{ runner.temp }}/baseline/
      - run: pnpm install --frozen-lockfile
      # The shared upload invocation (.github/actions/publish-upload): env
      # markers, ARGS assembly and the baseline export live in ONE composite
      # action so the two publish workflows can never drift apart. Dispatch
      # inputs reach the shell through env vars, never interpolated into the
      # run script (script-injection surface).
      - uses: ./.github/actions/publish-upload
        with:
          mode: ${{ inputs.mode }}
          include: ${{ inputs.include }}
          platforms: 'win'
          force: ${{ inputs.force }}
          baseline-file: ${{ runner.temp }}/baseline/hashes.json
          vt-api-key: ${{ secrets.VT_API_KEY }}

  publish-linux:
    name: publish — linux binaries
    needs: publish-win
    environment: ${{ inputs.mode == 'prod' && 'release' || null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: $/.github/actions/setup-repo
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-hashes
          path: ${{ runner.temp }}/baseline/
      # The 'linux' platform builds the aarch64 twin too (upload.mjs expands
      # it automatically), so the cross toolchain is required here.
      - name: Harden apt sources
        uses: ./.github/actions/harden-apt

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1

      - uses: ./.github/actions/publish-upload
        with:
          mode: ${{ inputs.mode }}
          include: ${{ inputs.include }}
          platforms: 'linux'
          force: ${{ inputs.force }}
          baseline-file: ${{ runner.temp }}/baseline/hashes.json
          vt-api-key: ${{ secrets.VT_API_KEY }}

  publish-mac:
    name: publish — mac binaries
    needs: publish-linux
    environment: ${{ inputs.mode == 'prod' && 'release' || null }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: $/.github/actions/setup-repo
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-hashes
          path: ${{ runner.temp }}/baseline/
      - uses: ./.github/actions/publish-upload
        with:
          mode: ${{ inputs.mode }}
          include: ${{ inputs.include }}
          platforms: 'mac'
          force: ${{ inputs.force }}
          baseline-file: ${{ runner.temp }}/baseline/hashes.json
          vt-api-key: ${{ secrets.VT_API_KEY }}
